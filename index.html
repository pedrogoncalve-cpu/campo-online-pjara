<style>
/* VOICE: cartaz da educação do campo: forte, coletivo, alegre, feito para estudante
   IDEA: o mural da escola do campo, com faixas, estrelas, raios de sol e carimbos
   PICTURE: logo com estrela, enxada e lápis; o mascote Campina; ícones próprios; cenas do sertão que reagem
   COLOUR and TYPE: vermelho, dourado e preto; barro na Biologia; Anton condensada nos títulos, com fallback Impact offline
   LAYOUT: faixa vermelha com raios, letreiro de estrelas, grade de cartazes; página de experimento com faixa da disciplina */
:root{color-scheme:light dark;--bg:light-dark(#f7efdf,#120d0a);--paper:light-dark(#fffaf0,#1c1511);--ink:light-dark(#16100c,#f3ead9);--soft:light-dark(#5c4d3f,#c9b9a3);--card:light-dark(#fffaf0,#1f1813);--line:light-dark(#16100c,#5a4636);--red:#c8102e;--redd:#8f0b20;--redt:light-dark(#a00d25,#ff8a80);--gold:#f2b705;--goldt:light-dark(#7a5200,#f5c451);--clay:#b5652b;--sky:light-dark(#f6e3bd,#1c1510);--ground:light-dark(#c98b4a,#5a3a1f);--ground2:light-dark(#a86d33,#43290f);--water:light-dark(#2d7fc1,#5aa9e6);--leaf:light-dark(#3f7d1e,#7cbf4a);--leaft:light-dark(#2d5a12,#a9d98a);--tank:light-dark(#ece5d8,#2c241d);--dark:light-dark(#16100c,#e9dfcc);--warnbg:light-dark(#fdf0d2,#3a2a08);--badbg:light-dark(#fbe1df,#3a1210);--okbg:light-dark(#e6f2dc,#1e3313);--m:light-dark(#f3e8d4,#18120e);--disp:"Anton",Impact,"Arial Narrow Bold","Franklin Gothic Medium",sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,14px)}
.disp{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.5px;line-height:.98}
.fis{--dc:#c8102e;--don:#fff;--dt:var(--redt)}.qui{--dc:#f2b705;--don:#16100c;--dt:var(--goldt)}.bio{--dc:#b5652b;--don:#fff;--dt:light-dark(#8a4516,#e8a06a)}.mat{--dc:#16100c;--don:#f2b705;--dt:var(--ink)}
:root[data-theme=dark] .mat,.mat{--dc:light-dark(#16100c,#2a201a)}
.hero{position:relative;overflow:hidden;background:var(--red);color:#fff;border-bottom:8px solid #16100c}
.hero::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(242,183,5,.16) 0deg 7deg,transparent 7deg 18deg);transform:translate(-18%,8%)}
.hero .wrap{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;padding-top:26px;padding-bottom:26px}
.logo{width:clamp(96px,16vw,150px);height:auto;display:block}
.brand{font-size:clamp(44px,9vw,92px);margin:0;color:#fff}
.brand span{color:var(--gold);display:block}
.tag{margin:10px 0 0;font-weight:700;font-size:clamp(15px,2.2vw,19px);color:#fff3d6;max-width:30em}
.masc{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:250px}
.bubble{position:relative;background:#fffaf0;color:#16100c;border:3px solid #16100c;border-radius:16px;padding:10px 12px;font-size:14px;font-weight:700;line-height:1.35}
.bubble::after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-10px;border:10px solid transparent;border-top-color:#16100c;border-bottom:0}
.masc svg{width:120px;height:auto}
@media(max-width:820px){.hero .wrap{grid-template-columns:auto minmax(0,1fr)}.masc{grid-column:1/-1;flex-direction:row-reverse;max-width:none;justify-content:flex-end}.masc svg{width:92px;flex:none}.masc .bubble::after{left:-14px;right:auto;top:50%;bottom:auto;margin:-10px 0 0;border:10px solid transparent;border-right-color:#16100c;border-left:0}}
.ticker{background:#16100c;color:var(--gold);font-family:var(--disp);text-transform:uppercase;font-size:20px;letter-spacing:1px;white-space:nowrap;overflow:hidden;padding:8px 0;border-bottom:4px solid var(--gold)}
.ticker span{display:inline-block;animation:tick 50s linear infinite}
@keyframes tick{to{transform:translateX(-50%)}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:22px 0 8px}
.f{font:inherit;font-weight:700;font-size:15px;min-height:44px;padding:0 16px;border-radius:6px;border:3px solid #16100c;background:var(--paper);color:var(--ink);cursor:pointer}
.f[aria-pressed=true]{background:var(--dc,#16100c);color:var(--don,#f2b705);border-color:#16100c}
.prog{margin-left:auto;font-family:var(--disp);text-transform:uppercase;font-size:20px;color:var(--redt)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:22px;padding:14px 0 40px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:3px solid #16100c;border-radius:6px;overflow:hidden;text-decoration:none;box-shadow:6px 6px 0 var(--dc);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 var(--dc)}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.thumb{background:var(--sky);border-bottom:3px solid #16100c}
.thumb svg{display:block;width:100%;height:auto}
.ico{position:absolute;top:10px;left:10px;width:54px;height:54px;border-radius:50%;background:var(--dc);color:var(--don);border:3px solid #16100c;display:grid;place-items:center}
.ico svg{width:32px;height:32px}
.cb{padding:12px 14px 16px;flex:1;display:flex;flex-direction:column;gap:4px}
.cb h3{margin:4px 0 0;font-size:24px}
.cb p{margin:0;font-size:14px;color:var(--soft)}
.chip{display:inline-block;align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:4px;background:var(--dc);color:var(--don);text-transform:uppercase;letter-spacing:.5px;margin-right:6px}
.feito{position:absolute;top:12px;right:12px;background:#16100c;color:var(--gold);font-weight:700;font-size:13px;padding:4px 10px;border-radius:4px;border:2px solid var(--gold)}
.shead{background:var(--dc);color:var(--don);border-bottom:8px solid #16100c;position:relative;overflow:hidden}
.shead::before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(rgba(255,255,255,.08) 0deg 7deg,transparent 7deg 18deg);transform:translate(30%,10%)}
.shead .wrap{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding-top:16px;padding-bottom:22px}
.shead .ico{position:static;width:84px;height:84px;background:#16100c;color:var(--gold);border-color:#fffaf0}
.shead .ico svg{width:50px;height:50px}
@media(max-width:600px){.shead .wrap{grid-template-columns:minmax(0,1fr)}.shead .ico{width:60px;height:60px}.shead .ico svg{width:36px;height:36px}}
.back{grid-column:1/-1;display:inline-flex;align-items:center;gap:6px;min-height:44px;color:inherit;text-decoration:none;font-weight:700;font-size:15px}
.back:hover{text-decoration:underline}
.mini{width:30px;height:30px}
.enem{display:inline-block;font-weight:700;font-size:14px;background:#16100c;color:var(--gold);padding:3px 10px;border-radius:4px}
h1{font-size:clamp(32px,6vw,58px);margin:8px 0 6px;text-wrap:balance}
.ctx{margin:0;max-width:46em;font-size:16px}
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;padding:24px 0}
@media(max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.scene{border:3px solid #16100c;border-radius:6px;overflow:hidden;background:var(--sky);box-shadow:6px 6px 0 var(--dc)}
.scene svg{display:block;width:100%;height:auto}
.fx{font-family:Georgia,serif;font-size:17px;background:var(--paper);border:3px solid #16100c;border-left:12px solid var(--dc);padding:10px 14px;margin:16px 0 0;overflow-wrap:anywhere}
.res{background:var(--paper);border:3px solid #16100c;border-radius:6px;padding:16px;box-shadow:6px 6px 0 #16100c}
.big{font-family:var(--disp);font-size:clamp(40px,7vw,60px);line-height:1;color:var(--redt);margin-top:4px}
.lbl{font-size:14px;color:var(--soft);font-weight:700}
.st{display:inline-block;margin-top:10px;padding:6px 12px;border-radius:4px;font-size:14px;font-weight:700;border:2px solid currentColor}
.ok{background:var(--okbg);color:var(--leaft)}.warn{background:var(--warnbg);color:var(--goldt)}.bad{background:var(--badbg);color:var(--redt)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.m{background:var(--m);border-radius:4px;padding:8px 10px;border-left:5px solid var(--dc)}
.m b{display:block;font-size:18px}
.ctrl{background:var(--paper);border:3px solid #16100c;border-radius:6px;padding:10px 16px;margin-bottom:24px}
.ctrl h2,.two h2,.q h2{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:28px;margin:6px 0 6px;letter-spacing:.5px}
.row{display:grid;grid-template-columns:11em minmax(0,1fr) 6.5em;align-items:center;gap:10px;min-height:48px}
.row label{font-size:15px;font-weight:700}
.row output{font-weight:700;text-align:right;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--red);height:32px}
select{font:inherit;font-size:16px;min-height:44px;padding:0 10px;border-radius:6px;border:2px solid #16100c;background:var(--bg);color:var(--ink);grid-column:2/4}
@media(max-width:560px){.row{grid-template-columns:minmax(0,1fr) auto}.row input{grid-column:1/-1;grid-row:2}.row select{grid-column:1/-1;grid-row:2}}
.btn{font:inherit;font-weight:700;font-size:16px;min-height:44px;padding:0 18px;border-radius:6px;border:3px solid #16100c;background:var(--red);color:#fff;cursor:pointer;margin:6px 0;box-shadow:3px 3px 0 #16100c}
button:focus-visible,select:focus-visible,input:focus-visible,.f:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.dica{display:flex;align-items:center;gap:14px;margin:0 0 24px}
.dica svg{width:96px;flex:none;height:auto}
.dica .bubble{font-size:15px}
.dica .bubble::after{left:-14px;top:50%;bottom:auto;margin:-10px 0 0;border:10px solid transparent;border-right-color:#16100c;border-left:0}
.dica b{color:var(--red)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;padding:4px 0 34px}
@media(max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.q{background:var(--paper);border:3px solid #16100c;border-radius:6px;padding:16px;box-shadow:6px 6px 0 var(--red)}
.q p{margin:0 0 12px}
.op{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:15px;min-height:44px;padding:10px 12px;margin:0 0 8px;border:2px solid #16100c;border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}
.op b{flex:none;width:1.6em;color:var(--redt)}
.op.certo{border-color:var(--leaf);background:var(--okbg)}.op.errado{border-color:var(--red);background:var(--badbg)}
.fb{font-size:15px;min-height:1.2em;margin-top:4px}
.nav2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 0 34px}
.nav2 a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:3px solid #16100c;border-radius:6px;background:var(--paper);text-decoration:none;font-weight:700;box-shadow:3px 3px 0 #16100c}
footer{background:#16100c;color:#e8dcc8;border-top:6px solid var(--gold);padding:22px 0 30px;font-size:13px}
footer .disp{color:var(--gold);font-size:24px;margin-bottom:6px}
@keyframes cai{0%{transform:translateY(0);opacity:1}100%{transform:translateY(24px);opacity:0}}
@keyframes sobe{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-40px);opacity:0}}
.drop{animation:cai var(--d,1s) linear infinite}.bub{animation:sobe var(--d,2s) linear infinite}
@media(prefers-reduced-motion:reduce){.drop,.bub,.ticker span{animation:none}.card{transition:none}}
.inst{display:none;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:16px;min-height:48px;padding:0 18px;margin-top:14px;border-radius:6px;border:3px solid #16100c;background:var(--gold);color:#16100c;cursor:pointer;box-shadow:4px 4px 0 #16100c}
.inst.on{display:inline-flex}
.ajuda{display:none;margin-top:12px;background:#fffaf0;color:#16100c;border:3px solid #16100c;border-radius:8px;padding:10px 14px;font-size:15px;max-width:34em}
.ajuda.on{display:block}
.lab{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);grid-template-areas:"stage ctrl" "stage res";gap:18px 22px;padding:22px 0;align-items:start}
.stage{grid-area:stage;position:sticky;top:8px;z-index:4}
.lab .ctrl{grid-area:ctrl;margin:0}.lab .res{grid-area:res}
.scene{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.scene:active{cursor:grabbing}
.readout{display:none}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#16100c;color:#f2b705;font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .4s;animation:pisca 2.4s ease-in-out infinite;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.hint.off{opacity:0}
@keyframes pisca{50%{transform:translateX(-50%) scale(1.06)}}
.row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l o" "i i";gap:0 10px;min-height:0;padding:6px 0}
.row label{grid-area:l}.row output{grid-area:o}.row input{grid-area:i}
.row.sel{grid-template-areas:"l s";grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}.row.sel select{grid-area:s}
.res .fx{margin-top:12px;box-shadow:none}
.ctx2{display:none}
@media(max-width:860px){
 .shead .wrap{padding-top:4px;padding-bottom:10px;gap:10px;grid-template-columns:auto minmax(0,1fr)}
 .shead .back{min-height:36px;font-size:14px}
 .shead .ico{width:46px;height:46px}.shead .ico svg{width:28px;height:28px}
 .shead h1{font-size:26px;margin:4px 0 0}.shead .ctx,.shead .enem{display:none}.shead .chip{font-size:11px}
 .ctx2{display:block;font-weight:700}
 .lab{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "ctrl" "res";padding:0 0 18px;gap:12px}
 .stage{top:0;margin:0 calc(-1*max(4vw,14px));padding:8px max(4vw,14px) 6px;background:var(--bg);border-bottom:3px solid #16100c}
 .scene{box-shadow:none}
 .readout{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 2px 0}
 .readout b{flex:none;font-family:var(--disp);font-weight:400;font-size:28px;line-height:1;color:var(--redt);white-space:nowrap}
 .readout span{flex:1 1 auto;min-width:0;font-size:12px;font-weight:700;text-align:right;padding:3px 8px;border-radius:4px;line-height:1.25}
 .lab .ctrl{padding:4px 14px}.lab .ctrl h2{display:none}
 .row{padding:3px 0}.row label{font-size:14px}.row output{font-size:14px}
 input[type=range]{height:28px}
 .hint{top:16px;font-size:12px}
 .dica svg{width:70px}
}
@media(max-width:860px) and (max-height:700px){.shead .ico{display:none}.shead .wrap{grid-template-columns:minmax(0,1fr)}}
</style>
</head>

<div id="app"></div>
<script>
{
const br=(x,n=1)=>(+x).toLocaleString('pt-BR',{minimumFractionDigits:n,maximumFractionDigits:n});
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
function rng(seed){let s=(seed*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
const T=(x,y,s,sz=24,a='start',f='var(--ink)',w=700)=>`<text x="${x}" y="${y}" font-size="${sz}" font-weight="${w}" text-anchor="${a}" fill="${f}">${s}</text>`;
const wrapS=(s,inner)=>`<svg viewBox="0 0 800 420" role="img" aria-label="${s.t}">${inner}</svg>`;
const sky=`<rect width="800" height="420" fill="var(--sky)"/>`;
const sun=(x,y,r=34,o=.9)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="var(--gold)" opacity="${o}"/>`;
const ground=(y,h=420)=>`<rect y="${y}" width="800" height="${h-y}" fill="var(--ground)"/><rect y="${y+30}" width="800" height="${h-y-30}" fill="var(--ground2)"/>`;
const thermo=(x,t,lab)=>{const f=cl((t-5)/40,0,1)*170;return `<rect x="${x-9}" y="150" width="18" height="190" rx="9" fill="var(--tank)" stroke="var(--dark)" stroke-width="3"/><rect x="${x-4}" y="${330-f}" width="8" height="${f+10}" fill="var(--red)"/><circle cx="${x}" cy="345" r="16" fill="var(--red)" stroke="var(--dark)" stroke-width="3"/>${T(x,392,lab,20,'middle')}`};

function irr(hT,d,L,N){const H=hT+d,q=P=>2*Math.sqrt(Math.max(P,0)/10),HW=(L,Q)=>.36*10.67*L*Math.pow(Q,1.852)/(Math.pow(140,1.852)*Math.pow(.0136,4.87));let hf=0;for(let i=0;i<40;i++){const Q=N*q(H-hf/2)/3.6e6;hf=(hf+Math.min(HW(L,Q),H))/2}const Pl=Math.max(H-hf,0);return{H,hf,Pl,q0:q(H),ql:q(Pl),Qt:N*q(H-hf/2)}}
function stull(t,rh){return t*Math.atan(.151977*Math.sqrt(rh+8.313659))+Math.atan(t+rh)-Math.atan(rh-1.676331)+.00391838*Math.pow(rh,1.5)*Math.atan(.023101*rh)-4.686035}
function praga(v){const K=1000,r=.25,a=.01,b=.05,m=.15,dt=.05;let N=100,P=v.jo,Ns=[N],Ps=[P],sp=[],pk=N;for(let d=1;d<=150;d++){for(let k=0;k<20;k++){const dN=r*N*(1-N/K)-a*N*P,dP=b*a*N*P-m*P;N=Math.max(N+dN*dt,0);P=Math.max(P+dP*dt,0)}if(v.ven>0&&d%20===0){N*=1-v.ven/100;P*=Math.max(0,1-1.3*v.ven/100);if(P<.5)P=0;sp.push(d)}Ns.push(N);Ps.push(P);pk=Math.max(pk,N)}return{Ns,Ps,sp,pk,dano:Ns.reduce((x,y)=>x+y,0)/Ns.length/K*100,Pf:P}}
const GT={2:'PP',1:'Pp',0:'pp'},GM={2:['P','P'],1:['P','p'],0:['p','p']};
function line(arr,x0,x1,y0,y1,max){return arr.map((y,i)=>`${(x0+(x1-x0)*i/(arr.length-1)).toFixed(1)},${(y0-(y0-y1)*cl(y/max,0,1)).toFixed(1)}`).join(' ')}

const SIMS=[
{id:'irrigacao',d:'Física',t:'Gotejamento e a caixa d’água',enem:'Hidrostática: Teorema de Stevin',
ctx:'Por que a caixa d’água fica no alto? O peso da água empurra a água pela mangueira até cada gotejador do canteiro. Descubra que altura você precisa para molhar bem toda a plantação.',
con:'A pressão de um líquido parado cresce com a altura da coluna: <b>P = ρ·g·h</b>. Uns 10 m de água dão cerca de 1 bar (100 kPa); no campo se usa o mca (metro de coluna d’água). Mais pressão no gotejador, mais água. O atrito na mangueira faz o último gotejador receber menos que o primeiro.',
c:[{id:'h',l:'Altura da torre',min:.5,max:15,s:.5,v:5,u:'m'},{id:'d',l:'Nível na caixa',min:0,max:100,s:5,v:80,u:'%'},{id:'L',l:'Comprimento da linha',min:10,max:150,s:5,v:40,u:'m'},{id:'N',l:'Gotejadores',min:5,max:150,s:5,v:40,u:''}],
run:v=>{const s=irr(v.h,1.2*v.d/100,v.L,v.N),u=s.q0?s.ql/s.q0:0;return{...s,big:br(s.ql,2)+' L/h',bl:'Vazão no último gotejador',st:s.ql<1?['bad','Pouca água: suba a caixa ou encurte a linha']:u<.9?['warn',`Desigual: o fim recebe ${Math.round(u*100)}% do início`]:['ok',`Irrigação uniforme (${Math.round(u*100)}%)`],m:[['Pressão no início',br(9.8*s.H)+' kPa'],['Em metros de água',br(s.H)+' mca'],['Pressão no fim',br(9.8*s.Pl)+' kPa'],['Vazão total',br(s.Qt,0)+' L/h']],fx:`P = ρ·g·h = 1000 · 9,8 · ${br(s.H,2)} ≈ ${br(9.8*s.H)} kPa`}},
draw:(v,r)=>{const G=380,px=17,tx=110,tw=100,th=50,bot=G-v.h*px-4,top=bot-th,lv=th*v.d/100,n=Math.min(v.N,14),x0=260,x1=770;let dr='';for(let i=0;i<n;i++){const f=n>1?i/(n-1):0,x=x0+(x1-x0)*f,qq=r.q0+(r.ql-r.q0)*f,rad=cl(qq*2.2,1.5,6),du=qq>.05?Math.max(.35,1.6/qq):0;dr+=`<path d="M${x} ${G-6} q-14 -26 -4 -46 q4 16 4 46 M${x} ${G-6} q14 -30 6 -50 q-8 18 -6 50" fill="var(--leaf)"/><rect x="${x-4}" y="${G-6}" width="8" height="8" rx="2" fill="var(--dark)"/>${du?`<circle class="drop" style="--d:${du.toFixed(2)}s" cx="${x}" cy="${G+6}" r="${rad.toFixed(1)}" fill="var(--water)"/>`:''}`}
const legs=Math.max(1,Math.floor(v.h/2));return sky+sun(700,70)+ground(G)+`<g stroke="var(--dark)" stroke-width="5" fill="none"><path d="M${tx+10} ${G} L${tx+22} ${bot}"/><path d="M${tx+tw-10} ${G} L${tx+tw-22} ${bot}"/>${Array.from({length:legs},(_,i)=>{const y=G-(i+1)*(G-bot)/(legs+1);return `<path d="M${tx+14} ${y} L${tx+tw-14} ${y}"/>`}).join('')}</g><rect x="${tx}" y="${top}" width="${tw}" height="${th}" rx="6" fill="var(--tank)" stroke="var(--dark)" stroke-width="4"/><rect x="${tx+4}" y="${bot-lv}" width="${tw-8}" height="${Math.max(lv-3,0)}" fill="var(--water)"/><rect x="${tx-6}" y="${top-10}" width="${tw+12}" height="12" rx="3" fill="var(--red)"/><path d="M${tx+tw/2} ${bot} V${G-4} H${x1+20}" stroke="var(--dark)" stroke-width="7" fill="none"/><path d="M${tx+tw/2} ${bot} V${G-4} H${x1+20}" stroke="var(--water)" stroke-width="3" fill="none"/>${dr}<g stroke="var(--red)" stroke-width="3"><path d="M60 ${bot-lv} V${G}"/><path d="M48 ${bot-lv} H72 M48 ${G} H72"/></g><text x="30" y="${(bot-lv+G)/2}" font-size="24" font-weight="700" fill="var(--redt)" text-anchor="middle" transform="rotate(-90 30 ${(bot-lv+G)/2})">h = ${br(r.H)} m</text>`},
q:{p:'Numa propriedade rural, a superfície da água de uma caixa está 8 m acima de uma torneira. Considerando g = 10 m/s² e a densidade da água 1 000 kg/m³, a pressão hidrostática na torneira é de',o:['0,8 kPa','8 kPa','80 kPa','800 kPa','8 000 kPa'],a:2,e:'P = ρ·g·h = 1 000 · 10 · 8 = 80 000 Pa = 80 kPa.'}},

{id:'bomba-solar',d:'Física',t:'Bomba solar enchendo a cisterna',enem:'Energia, potência e rendimento',
ctx:'O sol do sertão vira eletricidade nas placas, que move a bomba, que levanta a água do poço até a caixa no alto. Quantos litros por dia dá para bombear?',
con:'A placa transforma energia luminosa em elétrica; a bomba transforma elétrica em energia potencial da água: <b>E = m·g·h</b>. Nenhuma máquina aproveita tudo: o <b>rendimento</b> (η) diz que parte da energia vira trabalho útil. Quanto mais alto subir a água, menos litros com a mesma energia.',
c:[{id:'n',l:'Placas solares (550 W)',min:1,max:8,s:1,v:3,u:''},{id:'hsp',l:'Horas de sol pleno',min:3,max:7,s:.5,v:5.5,u:'h'},{id:'H',l:'Altura de bombeamento',min:5,max:60,s:1,v:25,u:'m'},{id:'eta',l:'Rendimento da bomba',min:20,max:60,s:5,v:40,u:'%'}],
run:v=>{const El=v.n*.55*v.hsp*.8,J=El*3.6e6*v.eta/100,Lt=J/(9.8*v.H);return{Lt,big:br(Lt,0)+' L',bl:'Água bombeada por dia',st:Lt<2000?['bad','Pouca água para a família e os animais']:Lt<16000?['warn',`A cisterna de 16 mil litros enche em ${br(16000/Lt)} dias`]:['ok',`Enche a cisterna de 16 mil litros em ${br(16000/Lt*v.hsp)} h de sol`],m:[['Energia elétrica',br(El)+' kWh/dia'],['Potência das placas',br(v.n*.55,2)+' kW'],['Energia útil',br(J/1e6)+' MJ'],['Caixas de 1 000 L',br(Lt/1000)]],fx:`m = E·η / (g·h) = ${br(El*3.6,1)} MJ · ${br(v.eta/100,2)} / (9,8 · ${v.H}) ≈ ${br(Lt,0)} kg`}},
draw:(v,r)=>{const G=360,yt=G-v.H*4.6,fill=cl(r.Lt/16000,0,1);let p='';for(let i=0;i<v.n;i++){const x=30+i*48;p+=`<path d="M${x} ${G-20} l40 0 l-14 -44 l-40 0z" fill="#1d3557" stroke="var(--dark)" stroke-width="2"/><path d="M${x+6} ${G-20} v20" stroke="var(--dark)" stroke-width="3"/>`}
return sky+sun(90,70,40)+`<path d="M520 ${G} Q620 ${yt+30} 690 ${yt} L800 ${yt} V${G}Z" fill="var(--ground2)"/>`+ground(G)+p+`<path d="M${30+v.n*48} ${G-10} Q440 ${G-30} 470 ${G}" stroke="var(--gold)" stroke-width="3" stroke-dasharray="6 5" fill="none"/><rect x="455" y="${G}" width="34" height="60" fill="var(--dark)"/><rect x="460" y="${G+30}" width="24" height="30" fill="var(--water)"/><path d="M472 ${G+40} V${G-8} Q600 ${G-8} 640 ${yt+10} L720 ${yt-10}" stroke="var(--dark)" stroke-width="7" fill="none"/><path d="M472 ${G+40} V${G-8} Q600 ${G-8} 640 ${yt+10} L720 ${yt-10}" stroke="var(--water)" stroke-width="3" fill="none"/><rect x="700" y="${yt-70}" width="80" height="70" rx="6" fill="var(--tank)" stroke="var(--dark)" stroke-width="4"/><rect x="704" y="${yt-4-62*fill}" width="72" height="${62*fill}" fill="var(--water)"/>${T(740,yt-80,'cisterna',20,'middle')}<g stroke="var(--red)" stroke-width="3"><path d="M600 ${yt} V${G}"/><path d="M588 ${yt} H612 M588 ${G} H612"/></g>${T(590,(yt+G)/2+8,'h = '+v.H+' m',24,'end','var(--redt)')}`},
q:{p:'Uma bomba solar eleva 1 000 L de água (1 000 kg) de um poço até uma caixa 20 m acima. Com g = 10 m/s², a energia potencial gravitacional ganha pela água é de',o:['2 kJ','20 kJ','200 kJ','2 000 kJ','20 000 kJ'],a:2,e:'E = m·g·h = 1 000 · 10 · 20 = 200 000 J = 200 kJ. A bomba precisa receber mais que isso, porque o rendimento é menor que 100%.'}},

{id:'pote-de-barro',d:'Física',t:'Por que a água do pote é fresquinha?',enem:'Calorimetria e calor latente',
ctx:'Sem geladeira, o sertanejo sempre teve água fresca no pote de barro. O segredo está nos poros do barro e no ar seco. Teste com ar úmido, vento e até uma garrafa de plástico.',
con:'A água que atravessa os poros evapora na superfície do pote. Para evaporar, ela precisa de <b>calor latente</b> (cerca de 2 400 J por grama), e boa parte vem da água de dentro, que esfria: <b>Q = m·c·ΔT = m<sub>evap</sub>·L</b>. Com ar seco e vento a evaporação é rápida; com ar úmido quase não acontece.',
c:[{id:'T',l:'Temperatura do ar',min:20,max:40,s:1,v:34,u:'°C'},{id:'UR',l:'Umidade do ar',min:10,max:90,s:5,v:40,u:'%'},{id:'ven',l:'Vento',opts:[[.45,'Sem vento'],[.6,'Brisa leve'],[.75,'Lugar ventilado']],v:.6},{id:'rec',l:'Recipiente',opts:[[1,'Pote de barro'],[0,'Garrafa de plástico']],v:1}],
run:v=>{const Tw=stull(v.T,v.UR),Ta=v.T-v.rec*v.ven*(v.T-Tw),dT=v.T-Ta,g=10*4186*dT/2.4e6*1000;return{Ta,Tw,dT,big:br(Ta)+' °C',bl:'Temperatura da água',st:dT>=6?['ok','Água bem fresquinha']:dT>=2.5?['warn','Esfria um pouco']:['bad',v.rec?'Quase não esfria: o ar está muito úmido':'Não esfria: o plástico não deixa a água transpirar'],m:[['Temperatura do ar',br(v.T,0)+' °C'],['Limite de resfriamento',br(Tw)+' °C'],['Queda de temperatura',br(dT)+' °C'],['Água evaporada (10 L)',br(g,0)+' g']],fx:`10 kg · 4186 · ${br(dT)} °C = m · 2 400 000 → m ≈ ${br(g,0)} g`}},
draw:(v,r)=>{const pote=v.rec?`<path d="M300 110 h80 v30 q90 40 90 130 q0 90 -130 90 q-130 0 -130 -90 q0 -90 90 -130z" fill="var(--clay)" stroke="var(--dark)" stroke-width="4"/><path d="M290 110 h100" stroke="var(--dark)" stroke-width="10" stroke-linecap="round"/>`:`<rect x="290" y="130" width="100" height="230" rx="30" fill="var(--water)" opacity=".45" stroke="var(--dark)" stroke-width="4"/><rect x="315" y="95" width="50" height="40" rx="6" fill="var(--red)"/>`;let w='';const k=v.rec?Math.round(r.dT/1.5):0;for(let i=0;i<k;i++){const x=200+(i%6)*55,y=120+(i%3)*40;w+=`<path class="bub" style="--d:${(2+i%3*.6).toFixed(1)}s" d="M${x} ${y} q8 -10 0 -20 q-8 -10 0 -20" stroke="var(--soft)" stroke-width="3" fill="none"/>`}
return sky+sun(80,70,30+v.T/2)+ground(360)+`<rect x="170" y="350" width="340" height="14" rx="4" fill="var(--dark)"/>`+pote+w+thermo(620,v.T,'ar')+thermo(720,r.Ta,'água')},
q:{p:'No sertão, é comum guardar água em potes de barro, que a mantêm mais fresca que o ambiente. Esse resfriamento acontece porque',o:['o barro é um isolante perfeito e impede a entrada de calor','a água que atravessa os poros evapora e retira calor da água do pote','o barro reflete toda a radiação solar que recebe','a água perde calor por condução para o chão','o barro libera frio para a água'],a:1,e:'A evaporação absorve calor latente, retirado em boa parte da água do pote, que esfria. Em ar úmido a evaporação diminui e o pote esfria menos.'}},

{id:'alavanca',d:'Física',t:'Alavanca para tirar pedra do roçado',enem:'Estática: momento de uma força',
ctx:'Limpar o roçado exige tirar pedras pesadas. Com um pau comprido e um apoio, uma pessoa consegue mover o que sozinha nunca levantaria. Encontre a melhor posição do apoio.',
con:'Na alavanca em equilíbrio, os momentos se igualam: <b>F·b<sub>p</sub> = P·b<sub>r</sub></b>. Quanto maior o braço onde você faz força (b<sub>p</sub>) e menor o braço da pedra (b<sub>r</sub>), menor a força necessária. Em troca, sua mão percorre uma distância maior: a energia se conserva.',
c:[{id:'m',l:'Massa da pedra',min:20,max:300,s:10,v:150,u:'kg'},{id:'dr',l:'Pedra até o apoio',min:.1,max:1,s:.05,v:.3,u:'m'},{id:'dp',l:'Mão até o apoio',min:.5,max:3,s:.1,v:1.5,u:'m'}],
run:v=>{const P=v.m*9.8,F=P*v.dr/v.dp,kg=F/9.8;return{F,big:br(F,0)+' N',bl:'Força que você precisa fazer',st:kg<=25?['ok','Dá pra fazer sozinho']:kg<=50?['warn','Esforço grande: cuidado com a coluna']:['bad','Chame ajuda ou aumente o braço da alavanca'],m:[['Peso da pedra',br(P,0)+' N'],['Equivale a levantar',br(kg,0)+' kg'],['Vantagem mecânica',br(v.dp/v.dr)+' ×'],['Pedra sobe 10 cm, mão desce',br(10*v.dp/v.dr,0)+' cm']],fx:`F = P·b<sub>r</sub> / b<sub>p</sub> = ${br(P,0)} · ${br(v.dr,2)} / ${br(v.dp)} ≈ ${br(F,0)} N`}},
draw:(v,r)=>{const G=330,tot=v.dr+v.dp,sc=Math.min(220,600/tot),x0=110,fx=x0+v.dr*sc,xe=fx+v.dp*sc,yb=G-56,rad=26+v.m/9;return sky+sun(720,60)+ground(G)+`<path d="M${fx-34} ${G} L${fx+34} ${G} L${fx} ${yb+6}z" fill="var(--dark)"/><rect x="${x0-30}" y="${yb-6}" width="${xe-x0+40}" height="12" rx="6" fill="#7a4a21" stroke="var(--dark)" stroke-width="2"/><ellipse cx="${x0}" cy="${yb-6-rad*.8}" rx="${rad}" ry="${rad*.8}" fill="#8d8a84" stroke="var(--dark)" stroke-width="3"/>${T(x0,yb-6-rad*.8+8,v.m+' kg',22,'middle','#fff')}<path d="M${xe} ${yb-150} V${yb-22}" stroke="var(--red)" stroke-width="8"/><path d="M${xe-16} ${yb-32} L${xe} ${yb-8} L${xe+16} ${yb-32}z" fill="var(--red)"/>${T(xe-14,yb-158,'F = '+br(r.F,0)+' N',24,'end','var(--redt)')}<g stroke="var(--gold)" stroke-width="3"><path d="M${x0} ${G+20} H${fx} M${fx} ${G+20} H${xe} M${x0} ${G+10} v20 M${fx} ${G+10} v20 M${xe} ${G+10} v20"/></g>${T((x0+fx)/2,G+56,'b<tspan dy="6" font-size="16">r</tspan><tspan dy="-6"> = '+br(v.dr,2)+' m</tspan>',22,'middle','#fff')}${T((fx+xe)/2,G+56,'b<tspan dy="6" font-size="16">p</tspan><tspan dy="-6"> = '+br(v.dp)+' m</tspan>',22,'middle','#fff')}`},
q:{p:'Para tirar uma pedra de 200 kg do roçado, um agricultor usa uma alavanca: a pedra fica a 0,5 m do apoio e ele empurra a 2 m do apoio. Com g = 10 m/s², a força mínima que ele precisa fazer é de',o:['100 N','250 N','500 N','1 000 N','2 000 N'],a:2,e:'F·2 = 2 000·0,5, então F = 500 N. O braço maior multiplica a força do agricultor por 4.'}},

{id:'calagem',d:'Química',t:'Calagem: corrigindo o solo ácido',enem:'pH, ácidos, bases e neutralização',
ctx:'Muitos solos do Brasil são ácidos e a planta não se desenvolve. O agricultor espalha calcário antes de plantar. Veja como a dose de calcário muda o pH e a saúde do milho.',
con:'O calcário (CaCO<sub>3</sub>) neutraliza a acidez: <b>CaCO<sub>3</sub> + 2 H<sup>+</sup> → Ca<sup>2+</sup> + H<sub>2</sub>O + CO<sub>2</sub></b>. O pH é logarítmico: subir 1 ponto deixa a concentração de H<sup>+</sup> 10 vezes menor. Abaixo de pH 5,5 o alumínio fica tóxico para as raízes. Solo argiloso “segura” mais acidez e precisa de mais calcário.',
c:[{id:'ph',l:'pH inicial do solo',min:4,max:6,s:.1,v:4.8,u:''},{id:'dose',l:'Calcário',min:0,max:5,s:.25,v:2,u:'t/ha'},{id:'k',l:'Tipo de solo',opts:[[.7,'Arenoso'],[.45,'Médio'],[.28,'Argiloso']],v:.45}],
run:v=>{const pf=Math.min(7.8,v.ph+v.dose*v.k),dp=pf-v.ph;return{pf,big:'pH '+br(pf),bl:'pH depois da calagem',st:pf<5.5?['bad','Ainda ácido: alumínio tóxico nas raízes']:pf<=6.8?['ok','Faixa boa para a maioria das culturas']:['warn','Calcário demais: faltam micronutrientes'],m:[['[H⁺] antes',`10<sup>−${br(v.ph)}</sup> mol/L`],['[H⁺] depois',`10<sup>−${br(pf)}</sup> mol/L`],['H⁺ ficou',br(Math.pow(10,dp),dp<1?1:0)+' × menor'],['Alumínio tóxico',pf<5.5?'Presente':'Neutralizado']],fx:'CaCO<sub>3</sub> + 2 H<sup>+</sup> → Ca<sup>2+</sup> + H<sub>2</sub>O + CO<sub>2</sub>'}},
draw:(v,r)=>{const cols=['#b3191e','#c8341c','#d9531a','#e57418','#ec9317','#e8a317','#c9b21f','#8db52b','#4e9d34','#2f8a55','#2c7d86','#2d6aa6','#3b55b3','#4a3fae','#5a2f9e'];let b='';for(let i=0;i<14;i++)b+=`<rect x="${50+i*50}" y="40" width="50" height="34" fill="${cols[i]}"/>${T(75+i*50,100,i+1,16,'middle','var(--soft)',400)}`;const mk=(p,c,l,y,a,dx)=>`<path d="M${50+p*50} ${y} l-12 -20 h24z" fill="${c}"/>${T(50+p*50+dx,y-24,l,20,a,c)}`;
const s=Math.exp(-Math.pow((r.pf-6.3)/.8,2)),h=50+160*s,G=280;let al='';if(r.pf<5.5)for(let i=0;i<Math.round((5.5-r.pf)*14);i++)al+=`<circle cx="${180+((i*97)%440)}" cy="${G+30+((i*53)%100)}" r="6" fill="var(--red)"/>`;
return sky+`<rect x="40" y="6" width="720" height="114" rx="8" fill="var(--card)" opacity=".7"/>`+b+mk(v.ph-1,'var(--soft)','antes',40,'end',-6)+mk(r.pf-1,'var(--dark)','depois',40,'start',6)+ground(G)+al+`<path d="M400 ${G} v${30+70*s} M400 ${G+20} l-30 ${20+40*s} M400 ${G+20} l30 ${20+40*s}" stroke="#e9dcc4" stroke-width="4" fill="none"/><path d="M400 ${G} V${G-h}" stroke="var(--leaf)" stroke-width="8"/><path d="M400 ${G-h*.35} q-70 -10 -90 -50 q50 0 90 30 M400 ${G-h*.6} q70 -10 90 -50 q-50 0 -90 30 M400 ${G-h*.85} q-55 -10 -70 -45 q40 5 70 30" fill="var(--leaf)"/>${s>.6?`<rect x="408" y="${G-h*.55}" width="18" height="40" rx="9" fill="var(--gold)"/>`:''}${r.pf<5.5?T(610,G+60,'Al³⁺ tóxico',22,'middle','#fff'):''}`},
q:{p:'A análise de solo de um roçado indicou pH 5. Após a calagem, o pH passou para 6. Com isso, a concentração de íons H⁺ no solo',o:['dobrou','caiu pela metade','ficou 10 vezes menor','ficou 10 vezes maior','diminuiu 1 mol/L'],a:2,e:'pH = −log[H⁺]. De pH 5 para 6, [H⁺] vai de 10⁻⁵ para 10⁻⁶ mol/L: 10 vezes menor.'}},

{id:'biodigestor',d:'Química',t:'Biodigestor: gás de cozinha do esterco',enem:'Combustão, estequiometria e energia',
ctx:'O esterco dos animais, fechado sem ar dentro do biodigestor, vira biogás para o fogão e biofertilizante para a horta. Quantos botijões a sua criação economiza por mês?',
con:'Bactérias que vivem sem oxigênio decompõem o esterco e liberam biogás, cerca de 60% <b>metano</b>. Na queima: <b>CH<sub>4</sub> + 2 O<sub>2</sub> → CO<sub>2</sub> + 2 H<sub>2</sub>O</b>, cada 16 g de metano formam 44 g de CO<sub>2</sub>. Queimar é melhor do que deixar escapar: o metano aquece a atmosfera muito mais que o CO<sub>2</sub>.',
c:[{id:'vac',l:'Vacas',min:0,max:20,s:1,v:4,u:''},{id:'cab',l:'Cabras e ovelhas',min:0,max:40,s:1,v:10,u:''},{id:'por',l:'Porcos',min:0,max:20,s:1,v:2,u:''}],
run:v=>{const est=10*v.vac+v.cab+2.5*v.por,gas=.4*v.vac+.05*v.cab+.175*v.por,bot=gas*30*.45/13,ch4=gas*.6*.717,co2=ch4*44/16,hr=gas/.35;return{gas,hr,big:br(gas,2)+' m³',bl:'Biogás por dia',st:gas<.7?['bad','Pouco gás: junte mais esterco']:bot<1?['warn',`Economiza ${br(bot)} botijão por mês`]:['ok',`Economiza ${br(bot)} botijões de 13 kg por mês`],m:[['Esterco por dia',br(est,0)+' kg'],['Fogão aceso',br(hr)+' h/dia'],['Metano queimado',br(ch4,2)+' kg/dia'],['CO₂ da queima',br(co2,2)+' kg/dia']],fx:`CH<sub>4</sub> + 2 O<sub>2</sub> → CO<sub>2</sub> + 2 H<sub>2</sub>O · ${br(ch4*1000,0)} g de CH<sub>4</sub> → ${br(co2*1000,0)} g de CO<sub>2</sub>`}},
draw:(v,r)=>{const G=250,gh=20+Math.min(90,r.gas*16),fl=cl(r.hr/4,.1,1);let bb='';for(let i=0;i<Math.min(12,Math.round(r.gas*3));i++)bb+=`<circle class="bub" style="--d:${(1.6+i%4*.4).toFixed(1)}s" cx="${300+(i*37)%200}" cy="${G+70-(i%3)*12}" r="${5+i%3*2}" fill="var(--gold)" opacity=".8"/>`;
return sky+sun(720,60)+ground(G)+T(400,46,`${v.vac} vacas · ${v.cab} cabras · ${v.por} porcos`,24,'middle')+`<ellipse cx="400" cy="${G+80}" rx="170" ry="80" fill="#4a3220" stroke="var(--dark)" stroke-width="4"/><ellipse cx="400" cy="${G+80}" rx="150" ry="62" fill="#6b4a2a"/>${bb}<path d="M230 ${G} a170 ${gh} 0 0 1 340 0z" fill="var(--gold)" opacity=".85" stroke="var(--dark)" stroke-width="4"/>${T(400,G-gh/2+8,'biogás',22,'middle','#120d0a')}<path d="M150 ${G-40} L250 ${G+50}" stroke="var(--dark)" stroke-width="16"/>${T(140,G-50,'esterco',20,'middle')}<path d="M550 ${G+50} L640 ${G-20}" stroke="var(--dark)" stroke-width="16"/>${T(650,G-30,'biofertilizante',20,'middle')}<path d="M400 ${G-gh} V120 H690 V170" stroke="var(--dark)" stroke-width="6" fill="none"/><rect x="650" y="170" width="90" height="16" rx="3" fill="var(--dark)"/><path d="M695 168 q-${18*fl} -${30*fl} 0 -${60*fl} q${18*fl} ${30*fl} 0 ${60*fl}z" fill="var(--red)"/><path d="M695 168 q-${8*fl} -${15*fl} 0 -${32*fl} q${8*fl} ${15*fl} 0 ${32*fl}z" fill="var(--gold)"/>`},
q:{p:'O principal componente do biogás é o metano, que queima segundo CH₄ + 2 O₂ → CO₂ + 2 H₂O. A queima de 16 g de metano produz quantos gramas de gás carbônico? (Massas molares: C = 12, H = 1, O = 16 g/mol)',o:['16 g','22 g','32 g','44 g','88 g'],a:3,e:'16 g de CH₄ é 1 mol, que forma 1 mol de CO₂, ou seja, 12 + 2·16 = 44 g.'}},

{id:'salinizacao',d:'Química',t:'Água salobra e o solo que vira sal',enem:'Soluções: concentração comum',
ctx:'No semiárido, muitos poços têm água salobra. Ao irrigar, a água evapora ou é absorvida pelas plantas, mas o sal fica no solo. A chuva ajuda a lavar. O que acontece com o roçado em 10 anos?',
con:'Concentração comum: <b>C = m/V</b>, então a massa de sal que chega ao solo é <b>m = C·V</b>. Cada 1 mm de irrigação num hectare são 10 000 L de água. Se pouco sal é lavado pela chuva, ele se acumula ano após ano, até o solo ficar salino e improdutivo.',
c:[{id:'C',l:'Sal na água do poço',min:.2,max:3,s:.1,v:1.2,u:'g/L'},{id:'I',l:'Irrigação por ano',min:300,max:1500,s:50,v:800,u:'mm'},{id:'R',l:'Chuva por ano',min:200,max:1200,s:50,v:650,u:'mm'}],
run:v=>{const add=v.C*v.I*.01,f=.7*v.R/(v.R+v.I);let S=0;const a=[0];for(let y=0;y<10;y++){S=(S+add)*(1-f);a.push(S)}return{a,S,big:br(S)+' t/ha',bl:'Sal no solo após 10 anos',st:S<12?['ok','Solo saudável: a chuva dá conta de lavar']:S<25?['warn','Solo salinizando: produção começa a cair']:['bad','Solo salino: risco de perder o roçado'],m:[['Sal que chega por ano',br(add)+' t/ha'],['Lavado pela chuva',Math.round(f*100)+'% ao ano'],['Sal em 1 000 L de água',br(v.C)+' kg'],['Água por hectare/ano',br(v.I*10,0)+' m³']],fx:`m = C·V = ${br(v.C)} kg/m³ · ${br(v.I*10,0)} m³ ≈ ${br(add)} t de sal por hectare a cada ano`}},
draw:(v,r)=>{const x0=100,x1=760,y0=350,y1=60,mx=Math.max(40,Math.max(...r.a)*1.1),Y=s=>y0-(y0-y1)*s/mx;let tk='';for(let y=0;y<=10;y+=2)tk+=T(x0+(x1-x0)*y/10,y0+30,y,18,'middle','var(--soft)',400);
return `<rect width="800" height="420" fill="var(--card)"/><rect x="${x0}" y="${y1}" width="${x1-x0}" height="${Y(25)-y1}" fill="var(--badbg)"/><rect x="${x0}" y="${Y(25)}" width="${x1-x0}" height="${Y(12)-Y(25)}" fill="var(--warnbg)"/>${T(x1-8,y1+28,'solo salino',20,'end','var(--redt)')}${T(x1-8,Y(25)+28,'salinizando',20,'end','var(--goldt)')}<path d="M${x0} ${y1} V${y0} H${x1}" stroke="var(--dark)" stroke-width="2" fill="none"/>${tk}${T((x0+x1)/2,y0+60,'anos',18,'middle','var(--soft)',400)}${T(x0-10,y1+6,br(mx,0),18,'end','var(--soft)',400)}${T(x0-10,y0,'0',18,'end','var(--soft)',400)}${T(x0-10,y1+30,'t/ha',16,'end','var(--soft)',400)}<polyline points="${line(r.a,x0,x1,y0,y1,mx)}" fill="none" stroke="var(--red)" stroke-width="5" stroke-linejoin="round"/>${r.a.map((s,i)=>`<circle cx="${x0+(x1-x0)*i/10}" cy="${Y(s)}" r="6" fill="var(--red)"/>`).join('')}`},
q:{p:'Um agricultor irriga com água de um poço que contém 1,5 g de sais por litro. Em uma semana ele usa 4 000 L. Se toda essa água evaporar ou for absorvida pelas plantas, a massa de sais deixada no solo será de',o:['1,5 kg','4 kg','6 kg','15 kg','60 kg'],a:2,e:'m = C·V = 1,5 g/L · 4 000 L = 6 000 g = 6 kg. As plantas absorvem a água, mas deixam a maior parte do sal no solo.'}},

{id:'genetica',d:'Biologia',t:'Bezerro com ou sem chifre?',enem:'Genética: 1ª Lei de Mendel',
ctx:'No gado, nascer sem chifre (mocho) é dominante sobre ter chifre (aspado). Escolha o touro e a vaca e veja nascer o rebanho. O resultado bate com o quadro de Punnett?',
con:'Cada animal tem dois alelos e passa só um para o filho (<b>1ª Lei de Mendel</b>). O alelo <b>P</b> (mocho) domina o <b>p</b> (aspado): só nasce com chifre o bezerro <b>pp</b>. O quadro de Punnett dá a probabilidade; com poucos bezerros o resultado real pode fugir dela, como no cara ou coroa.',
c:[{id:'pt',l:'Touro',opts:[[2,'PP · mocho'],[1,'Pp · mocho'],[0,'pp · aspado']],v:1},{id:'pv',l:'Vaca',opts:[[2,'PP · mocho'],[1,'Pp · mocho'],[0,'pp · aspado']],v:1},{id:'n',l:'Bezerros',min:4,max:100,s:4,v:40,u:''}],
act:'Nova geração',
run:v=>{const gt=GM[v.pt],gv=GM[v.pv],R=rng(v.seed);let cnt={PP:0,Pp:0,pp:0};const cv=[];for(let i=0;i<v.n;i++){const a=gt[R()<.5?0:1],b=gv[R()<.5?0:1],g=a==='P'&&b==='P'?'PP':a==='p'&&b==='p'?'pp':'Pp';cnt[g]++;cv.push(g!=='pp')}let pe=0;gt.forEach(a=>gv.forEach(b=>{if(a==='P'||b==='P')pe+=25}));const mo=cnt.PP+cnt.Pp,po=mo/v.n*100;return{cv,po,pe,big:Math.round(po)+'% mochos',bl:`Nasceram ${mo} mochos e ${cnt.pp} aspados`,st:Math.abs(po-pe)<=8?['ok',`Perto do esperado (${pe}% mochos)`]:['warn',`Longe dos ${pe}% esperados: tente mais bezerros`],m:[['Esperado (Punnett)',pe+'% mochos'],['PP',cnt.PP],['Pp',cnt.Pp],['pp (aspados)',cnt.pp]],fx:`${GT[v.pt]} × ${GT[v.pv]} → ${pe}% mochos : ${100-pe}% aspados`}},
draw:(v,r)=>{const gt=GM[v.pt],gv=GM[v.pv];let p=T(160,50,'touro',20,'middle')+T(40,175,'vaca',20,'middle');gt.forEach((a,i)=>p+=T(120+i*90,85,a,28,'middle','var(--redt)'));gv.forEach((b,j)=>{p+=T(80,150+j*90,b,28,'middle','var(--goldt)');gt.forEach((a,i)=>{const g=a===b?a+b:'Pp',mo=g!=='pp';p+=`<rect x="${78+i*90}" y="${100+j*90}" width="84" height="84" rx="8" fill="${mo?'var(--badbg)':'var(--warnbg)'}" stroke="var(--dark)" stroke-width="2"/>`+T(120+i*90,152+j*90,g,26,'middle',mo?'var(--redt)':'var(--goldt)')})});
let c='';const cols=10,sz=Math.min(34,300/Math.ceil(v.n/cols));r.cv.forEach((m,i)=>{const x=330+(i%cols)*44,y=70+Math.floor(i/cols)*(sz+6);c+=`<circle cx="${x}" cy="${y}" r="${sz/2.4}" fill="${m?'var(--red)':'var(--gold)'}"/>${m?'':`<path d="M${x-sz/3} ${y-sz/4} l-5 -10 M${x+sz/3} ${y-sz/4} l5 -10" stroke="var(--dark)" stroke-width="3"/>`}`});
return `<rect width="800" height="420" fill="var(--card)"/>`+p+c+`<circle cx="350" cy="395" r="9" fill="var(--red)"/>${T(366,402,'mocho',18,'start','var(--ink)',400)}<circle cx="470" cy="395" r="9" fill="var(--gold)"/>${T(486,402,'aspado (com chifre)',18,'start','var(--ink)',400)}`},
q:{p:'Em bovinos, a ausência de chifres (mocho) é condicionada por um alelo dominante. Do cruzamento de um touro mocho com uma vaca mocha, ambos heterozigotos, a proporção esperada de bezerros com chifres é de',o:['0%','25%','50%','75%','100%'],a:1,e:'Pp × Pp gera 1 PP : 2 Pp : 1 pp. Só o pp tem chifres: 1 em 4, ou 25%.'}},

{id:'controle-biologico',d:'Biologia',t:'Joaninha contra pulgão',enem:'Ecologia: predação e controle biológico',
ctx:'Os pulgões atacam o feijão e o agricultor tem duas saídas: soltar joaninhas, que comem pulgões, ou passar veneno a cada 20 dias. Compare as estratégias ao longo de 150 dias.',
con:'Predador e presa se regulam: com muita presa, o predador se multiplica; com muito predador, a presa diminui. Isso é <b>controle biológico</b>. O veneno também mata o inimigo natural, e sem ele a praga volta com força, o que obriga a passar mais veneno: um ciclo caro e perigoso para quem trabalha na roça.',
c:[{id:'jo',l:'Joaninhas soltas',min:0,max:30,s:1,v:5,u:''},{id:'ven',l:'Veneno a cada 20 dias',min:0,max:90,s:10,v:0,u:'%'}],
run:v=>{const s=praga(v);return{...s,big:Math.round(s.dano)+'%',bl:'Dano médio à lavoura',st:s.dano<40?['ok','Praga controlada']:s.dano<65?['warn','Praga parcialmente controlada']:['bad','A praga tomou conta do feijão'],m:[['Pico de pulgões',br(s.pk,0)],['Joaninhas no fim',br(s.Pf,0)],['Aplicações de veneno',s.sp.length],['Pulgões no fim',br(s.Ns[s.Ns.length-1],0)]],fx:'Presa: dN/dt = r·N − a·N·P &nbsp;·&nbsp; Predador: dP/dt = b·a·N·P − m·P'}},
draw:(v,r)=>{const x0=90,x1=740,y0=350,y1=70;let sp=r.sp.map(d=>{const x=x0+(x1-x0)*d/150;return `<path d="M${x} ${y1} V${y0}" stroke="var(--soft)" stroke-dasharray="5 5" stroke-width="2"/>`}).join('');let tk='';for(let d=0;d<=150;d+=30)tk+=T(x0+(x1-x0)*d/150,y0+28,d,18,'middle','var(--soft)',400);
return `<rect width="800" height="420" fill="var(--card)"/>`+sp+`<path d="M${x0} ${y1} V${y0} H${x1} V${y1}" stroke="var(--dark)" stroke-width="2" fill="none"/>${tk}${T((x0+x1)/2,y0+56,'dias',18,'middle','var(--soft)',400)}${T(x0-8,y1+6,'1000',16,'end','var(--redt)',400)}${T(x0-8,y0,'0',16,'end','var(--redt)',400)}${T(x1+8,y1+6,'60',16,'start','var(--goldt)',400)}<polyline points="${line(r.Ns,x0,x1,y0,y1,1000)}" fill="none" stroke="var(--red)" stroke-width="5"/><polyline points="${line(r.Ps,x0,x1,y0,y1,60)}" fill="none" stroke="var(--gold)" stroke-width="5"/><rect x="${x0+14}" y="${y1-50}" width="22" height="8" fill="var(--red)"/>${T(x0+44,y1-40,'pulgões',20)}<rect x="${x0+170}" y="${y1-50}" width="22" height="8" fill="var(--gold)"/>${T(x0+200,y1-40,'joaninhas (escala à direita)',20)}${r.sp.length?T(x1,y1-40,'- - veneno',18,'end','var(--soft)',400):''}`},
q:{p:'Uma plantação de feijão foi atacada por pulgões. Em vez de usar inseticida, o agricultor soltou joaninhas, que se alimentam desses insetos. Essa estratégia é chamada de',o:['controle químico','controle biológico','mutualismo','adubação verde','seleção artificial'],a:1,e:'Usa um inimigo natural da praga (relação predador-presa) para mantê-la sob controle, sem veneno.'}},

{id:'fotossintese',d:'Biologia',t:'Fotossíntese e os fatores limitantes',enem:'Fotossíntese e metabolismo energético',
ctx:'Sombrite, estufa, horário do dia e calor mudam o quanto a planta produz. Ajuste luz, gás carbônico e temperatura e descubra qual fator está segurando o crescimento.',
con:'Na fotossíntese a planta usa luz para produzir glicose: <b>6 CO<sub>2</sub> + 6 H<sub>2</sub>O → C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6 O<sub>2</sub></b>. A velocidade depende de luz, CO<sub>2</sub> e temperatura, e é limitada pelo fator que estiver em menor quantidade, o <b>fator limitante</b>. Calor demais desnatura as enzimas e derruba a produção.',
c:[{id:'L',l:'Luz',min:0,max:100,s:5,v:60,u:'%'},{id:'C',l:'Gás carbônico',min:200,max:1000,s:50,v:420,u:'ppm'},{id:'T',l:'Temperatura',min:5,max:45,s:1,v:28,u:'°C'}],
run:v=>{const fL=1.25*v.L/(v.L+25),fC=1.3*v.C/(v.C+300),fT=Math.exp(-Math.pow((v.T-30)/10,2)),rate=100*Math.min(fL,fC)*fT,lim=fT<Math.min(fL,fC)?'a temperatura':fL<fC?'a luz':'o gás carbônico';return{rate,lim,big:Math.round(rate)+'%',bl:'Taxa de fotossíntese',st:rate>=70?['ok',`Ótimo! O limite agora é ${lim}`]:rate>=35?['warn',`Fator limitante: ${lim}`]:['bad',`Planta quase parada. Limitante: ${lim}`],m:[['Luz aproveitada',Math.round(fL*100)+'%'],['CO₂ aproveitado',Math.round(fC*100)+'%'],['Efeito da temperatura',Math.round(fT*100)+'%'],['Bolhas de O₂',Math.round(rate/4)+' por min']],fx:'6 CO<sub>2</sub> + 6 H<sub>2</sub>O → C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6 O<sub>2</sub>'}},
draw:(v,r)=>{const G=340;let co='';for(let i=0;i<Math.round(v.C/60);i++){const x=40+(i*131)%300,y=110+(i*71)%180;co+=`<circle cx="${x}" cy="${y}" r="7" fill="var(--soft)"/><circle cx="${x+11}" cy="${y}" r="5" fill="var(--red)"/><circle cx="${x-11}" cy="${y}" r="5" fill="var(--red)"/>`}let o='';for(let i=0;i<Math.round(r.rate/10);i++)o+=`<circle class="bub" style="--d:${(1.4+i%4*.5).toFixed(1)}s" cx="${430+(i*47)%130}" cy="${150+(i*37)%110}" r="${5+i%3}" fill="none" stroke="var(--water)" stroke-width="3"/>`;
const k=.5+r.rate/200;return sky+`<circle cx="90" cy="70" r="${20+v.L/3}" fill="var(--gold)" opacity="${.15+.85*v.L/100}"/>`+ground(G)+co+T(190,96,'CO₂',22,'middle','var(--soft)')+`<path d="M500 ${G} V${G-230*k}" stroke="var(--leaf)" stroke-width="10"/>${[.3,.55,.8].map((f,i)=>{const y=G-230*k*f,s=i%2?1:-1;return `<path d="M500 ${y} q${s*90} -10 ${s*120} -70 q${-s*80} 0 ${-s*120} 70z" fill="var(--leaf)"/>`}).join('')}`+o+T(510,60,'O₂',22,'middle','var(--water)')+thermo(720,v.T,v.T+' °C')},
q:{p:'Numa estufa com luz forte e temperatura adequada, um agricultor aumentou a concentração de CO₂ e a fotossíntese cresceu. A partir de certo ponto, aumentar ainda mais o CO₂ não teve efeito. Isso indica que',o:['o CO₂ passou a ser o fator limitante','outro fator, como a luz, passou a limitar a fotossíntese','a planta deixou de respirar','a fotossíntese não depende de CO₂','a temperatura da estufa caiu'],a:1,e:'Quando um fator deixa de ser o mais escasso, outro (luz ou temperatura) passa a limitar a velocidade da fotossíntese.'}},
{id:'cerca-do-rocado',d:'Matemática',t:'Cercando o roçado',enem:'Geometria plana: área e perímetro',
ctx:'Arame farpado custa caro. Mude as medidas do roçado e o número de fios e veja quanto arame vai precisar e quanta terra fica cercada.',
con:'Perímetro é a volta inteira: <b>P = 2·(a + b)</b>. Área do retângulo: <b>A = a·b</b>. Um hectare tem 10 000 m². Com o mesmo perímetro, o <b>quadrado</b> é o retângulo de maior área: a linha tracejada mostra o quadrado que você cercaria com o mesmo arame.',
c:[{id:'a',l:'Comprimento',min:10,max:200,s:5,v:120,u:'m'},{id:'b',l:'Largura',min:10,max:200,s:5,v:40,u:'m'},{id:'f',l:'Fios de arame',min:2,max:6,s:1,v:4,u:''}],
run:v=>{const P=2*(v.a+v.b),A=v.a*v.b,ar=P*v.f,q=(P/4)**2,e=A/q;return{P,A,big:br(A,0)+' m²',bl:'Área cercada',st:e>=.95?['ok','Quase um quadrado: ótimo aproveitamento do arame']:[e>=.75?'warn':'bad',`Com o mesmo arame, um quadrado cercaria ${br(q,0)} m²`],m:[['Perímetro',br(P,0)+' m'],['Arame total',br(ar,0)+' m'],['Rolos de 500 m',Math.ceil(ar/500)],['Em hectares',br(A/1e4,2)+' ha']],fx:`A = ${v.a} · ${v.b} = ${br(A,0)} m² · P = 2·(${v.a} + ${v.b}) = ${br(P,0)} m`}},
draw:(v,r)=>{const sc=330/Math.max(v.a,v.b,r.P/4),w=v.a*sc,h=v.b*sc,x=(800-w)/2,y=(420-h)/2,qs=r.P/4*sc;let rows='';for(let yy=y+14;yy<y+h-6;yy+=16)rows+=`<path d="M${x+8} ${yy} H${x+w-8}" stroke="var(--leaf)" stroke-width="5" stroke-dasharray="3 7"/>`;let posts='';const per=[[x,y,x+w,y],[x+w,y,x+w,y+h],[x+w,y+h,x,y+h],[x,y+h,x,y]];per.forEach(([x1,y1,x2,y2])=>{const L=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.round(L/30));for(let i=0;i<n;i++)posts+=`<circle cx="${x1+(x2-x1)*i/n}" cy="${y1+(y2-y1)*i/n}" r="4" fill="var(--dark)"/>`});
return `<rect width="800" height="420" fill="var(--ground)"/><rect x="${(800-qs)/2}" y="${(420-qs)/2}" width="${qs}" height="${qs}" fill="none" stroke="var(--gold)" stroke-width="3" stroke-dasharray="10 8"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--sky)" opacity=".55" stroke="var(--dark)" stroke-width="3"/>${rows}${posts}${T(400,Math.max(26,y-10),v.a+' m',24,'middle','#fff')}${T(Math.min(790,x+w+10),y+h/2+8,v.b+' m',24,'start','#fff')}`},
q:{p:'Um agricultor tem arame suficiente para dar uma volta de 200 m e quer cercar um roçado retangular com a maior área possível. As medidas do roçado devem ser',o:['80 m × 20 m','70 m × 30 m','60 m × 40 m','50 m × 50 m','90 m × 10 m'],a:3,e:'Todas têm perímetro de 200 m, mas a maior área é a do quadrado: 50 · 50 = 2 500 m².'}},

{id:'agua-do-rebanho',d:'Matemática',t:'Quantos dias dura a água?',enem:'Grandezas inversamente proporcionais',
ctx:'A cisterna encheu no inverno e precisa durar até as próximas chuvas. Quanto mais gente e bicho usando, menos dias ela aguenta. Faça as contas da sua casa.',
con:'Volume fixo: <b>dias = volume ÷ consumo diário</b>. Se o consumo dobra, a duração cai pela metade: as grandezas são <b>inversamente proporcionais</b> (consumo × dias = constante). Consumos aproximados: pessoa 20 L/dia para beber e cozinhar, cabra ou ovelha 5 L, vaca 50 L.',
c:[{id:'V',l:'Água na cisterna',min:5000,max:52000,s:1000,v:16000,u:'L'},{id:'p',l:'Pessoas',min:1,max:10,s:1,v:4,u:''},{id:'c',l:'Cabras e ovelhas',min:0,max:50,s:1,v:10,u:''},{id:'vc',l:'Vacas',min:0,max:20,s:1,v:1,u:''}],
run:v=>{const cs=20*v.p+5*v.c+50*v.vc,d=v.V/cs;return{d,cs,big:br(d,0)+' dias',bl:'Duração da água',st:d>=240?['ok','Atravessa os 8 meses de estiagem']:d>=120?['warn','Dura só parte da estiagem']:['bad','Acaba rápido: reduza o consumo ou aumente o estoque'],m:[['Consumo por dia',br(cs,0)+' L'],['Em meses',br(d/30)],['Com o dobro do consumo',br(d/2,0)+' dias'],['Consumo × dias',br(cs*d,0)+' L']],fx:`dias = ${br(v.V,0)} ÷ ${br(cs,0)} ≈ ${br(d,0)}`}},
draw:(v,r)=>{const G=300,f=cl(v.V/52000,0,1),mo=Math.min(12,r.d/30);let cal='';'JFMAMJJASOND'.split('').forEach((l,i)=>{const x=400+(i%6)*62,y=60+Math.floor(i/6)*100,full=cl(mo-i,0,1);cal+=`<rect x="${x}" y="${y}" width="52" height="70" rx="6" fill="var(--tank)" stroke="var(--dark)" stroke-width="2"/><rect x="${x}" y="${y+70-70*full}" width="52" height="${70*full}" rx="6" fill="var(--water)"/>${T(x+26,y+46,l,24,'middle','var(--ink)')}`});
return sky+ground(G)+`<path d="M60 ${G-40} a110 30 0 0 0 220 0 V${G+50} a110 30 0 0 1 -220 0z" fill="var(--tank)" stroke="var(--dark)" stroke-width="4"/><rect x="64" y="${G+46-86*f}" width="212" height="${86*f}" fill="var(--water)"/><ellipse cx="170" cy="${G-40}" rx="110" ry="30" fill="var(--tank)" stroke="var(--dark)" stroke-width="4"/>${T(170,G-90,br(v.V,0)+' L',26,'middle')}`+cal+T(586,290,'meses de água',22,'middle')},
q:{p:'Uma cisterna abastece uma família de 4 pessoas por 120 dias. Mantendo o mesmo consumo por pessoa, se 6 pessoas usarem a mesma água, ela durará',o:['60 dias','80 dias','100 dias','160 dias','180 dias'],a:1,e:'4 · 120 = 6 · x, então x = 80 dias. Mais pessoas, menos dias: grandezas inversamente proporcionais.'}},

{id:'feira-ou-atravessador',d:'Matemática',t:'Feira ou atravessador?',enem:'Porcentagem',
ctx:'O atravessador busca a produção na porta, mas paga menos. Na feira o preço é cheio, mas tem custo de frete e banca. Qual compensa para a sua colheita?',
con:'Pagar <b>x% a menos</b> é multiplicar o preço por <b>(1 − x/100)</b>: 40% a menos é pagar 60% do preço. Para comparar, calcule a receita de cada caminho e tire os custos. A diferença em porcentagem é <b>(feira − atravessador) ÷ atravessador × 100</b>.',
c:[{id:'kg',l:'Produção',min:100,max:2000,s:50,v:500,u:'kg'},{id:'p',l:'Preço na feira',min:2,max:15,s:.5,v:6,u:'R$/kg'},{id:'d',l:'Atravessador paga menos',min:10,max:70,s:5,v:40,u:'%'},{id:'cu',l:'Custo da feira',min:0,max:600,s:20,v:200,u:'R$'}],
run:v=>{const fe=v.kg*v.p-v.cu,at=v.kg*v.p*(1-v.d/100),df=fe-at,pc=df/at*100;return{fe,at,big:(df>=0?'+ ':'− ')+'R$ '+br(Math.abs(df),2),bl:'Diferença ao vender na feira',st:df>0?['ok',`A feira rende ${br(pc,0)}% a mais`]:['warn','O atravessador compensa: o custo da feira ficou alto'],m:[['Na feira (já sem custos)','R$ '+br(fe,2)],['Com o atravessador','R$ '+br(at,2)],['Atravessador paga','R$ '+br(v.p*(1-v.d/100),2)+'/kg'],['Custo da feira','R$ '+br(v.cu,2)]],fx:`R$ ${br(v.p,2)} · (1 − ${br(v.d/100,2)}) = R$ ${br(v.p*(1-v.d/100),2)} por kg`}},
draw:(v,r)=>{const mx=Math.max(r.fe,r.at,1),W=520,bar=(y,val,c,l)=>`${T(40,y-14,l,24)}<rect x="40" y="${y}" width="${Math.max(4,W*Math.max(val,0)/mx)}" height="56" rx="8" fill="${c}"/>${T(50+Math.max(4,W*Math.max(val,0)/mx),y+38,'R$ '+br(val,0),26,'start','var(--ink)')}`;return `<rect width="800" height="420" fill="var(--card)"/>`+bar(90,r.fe,'var(--red)','Vendendo na feira')+bar(250,r.at,'var(--gold)','Vendendo para o atravessador')},
q:{p:'Na feira, um agricultor vende o quilo do queijo por R$ 40,00. O atravessador paga 30% a menos. Por quanto o atravessador compra o quilo?',o:['R$ 12,00','R$ 28,00','R$ 30,00','R$ 34,00','R$ 37,00'],a:1,e:'30% de 40 é 12, e 40 − 12 = 28. Ou direto: 40 · 0,7 = R$ 28,00.'}},

{id:'financiamento',d:'Matemática',t:'Financiamento da bomba d’água',enem:'Juros simples e compostos',
ctx:'Para comprar uma bomba ou um kit de irrigação, muitos agricultores fazem empréstimo. Veja quanto a dívida cresce com o tempo e a diferença entre juros simples e compostos.',
con:'Juros simples incidem só sobre o valor inicial: <b>M = C·(1 + i·n)</b>. Juros compostos incidem sobre o valor já acumulado, os “juros sobre juros”: <b>M = C·(1 + i)<sup>n</sup></b>. Quanto maior o prazo, maior a diferença. Bancos usam juros compostos.',
c:[{id:'C',l:'Valor emprestado',min:1000,max:30000,s:500,v:10000,u:'R$'},{id:'i',l:'Taxa de juros',min:.5,max:15,s:.5,v:8,u:'%/ano'},{id:'n',l:'Tempo sem pagar',min:1,max:10,s:1,v:5,u:'anos'}],
run:v=>{const i=v.i/100,Ms=v.C*(1+i*v.n),Mc=v.C*(1+i)**v.n,pc=(Mc-v.C)/v.C*100,s=[],c=[];for(let k=0;k<=v.n;k++){s.push(v.C*(1+i*k));c.push(v.C*(1+i)**k)}return{s,c,Mc,big:'R$ '+br(Mc,2),bl:'Dívida com juros compostos',st:[pc<20?'ok':pc<50?'warn':'bad',`Os juros somam ${br(pc,0)}% do valor emprestado`],m:[['Juros compostos','R$ '+br(Mc-v.C,2)],['Juros simples','R$ '+br(Ms-v.C,2)],['Diferença','R$ '+br(Mc-Ms,2)],['Valor emprestado','R$ '+br(v.C,2)]],fx:`M = ${br(v.C,0)} · (1 + ${br(i,3)})<sup>${v.n}</sup> ≈ R$ ${br(Mc,2)}`}},
draw:(v,r)=>{const x0=110,x1=740,y0=350,y1=70,mn=v.C*.9,mx=Math.max(...r.c)*1.05,Y=x=>y0-(y0-y1)*(x-mn)/(mx-mn),X=k=>x0+(x1-x0)*k/v.n,pts=a=>a.map((y,k)=>`${X(k)},${Y(y)}`).join(' ');let tk='';for(let k=0;k<=v.n;k++)tk+=T(X(k),y0+28,k,18,'middle','var(--soft)',400);
return `<rect width="800" height="420" fill="var(--card)"/><path d="M${x0} ${y1} V${y0} H${x1}" stroke="var(--dark)" stroke-width="2" fill="none"/>${tk}${T((x0+x1)/2,y0+56,'anos',18,'middle','var(--soft)',400)}${T(x0-8,Y(v.C)+6,'R$ '+br(v.C,0),16,'end','var(--soft)',400)}${T(x0-8,y1+6,'R$ '+br(mx,0),16,'end','var(--soft)',400)}<polyline points="${pts(r.s)}" fill="none" stroke="var(--gold)" stroke-width="5"/><polyline points="${pts(r.c)}" fill="none" stroke="var(--red)" stroke-width="5"/>${r.c.map((y,k)=>`<circle cx="${X(k)}" cy="${Y(y)}" r="6" fill="var(--red)"/>`).join('')}<rect x="${x0+10}" y="30" width="22" height="8" fill="var(--red)"/>${T(x0+40,40,'compostos',20)}<rect x="${x0+190}" y="30" width="22" height="8" fill="var(--gold)"/>${T(x0+220,40,'simples',20)}`},
q:{p:'Um agricultor pegou R$ 1 000,00 emprestados a juros compostos de 10% ao ano. Após 2 anos, sem pagar nada, a dívida será de',o:['R$ 1 020,00','R$ 1 100,00','R$ 1 200,00','R$ 1 210,00','R$ 1 300,00'],a:3,e:'1 000 · 1,1 · 1,1 = 1 210. No segundo ano os juros de 10% incidem sobre 1 100, e não sobre 1 000.'}},

{id:'chuvas',d:'Matemática',t:'O ano de chuva em números',enem:'Estatística: média, mediana e desvio',
ctx:'No sertão, todo mundo acompanha a chuva mês a mês. Compare anos diferentes e veja por que só a média não conta toda a história do inverno.',
con:'<b>Média</b> = soma ÷ quantidade. <b>Mediana</b> = valor do meio com os dados em ordem (com 12 meses, a média dos dois do meio). O <b>desvio padrão</b> mede o quanto os meses fogem da média. Uma chuvarada isolada puxa a média para cima, mas quase não mexe na mediana. Os anos aqui são exemplos ilustrativos.',
c:[{id:'ano',l:'Ano',opts:[[0,'Ano seco'],[1,'Ano normal'],[2,'Ano chuvoso'],[3,'Ano irregular']],v:1},{id:'x',l:'Chuvarada extra em março',min:0,max:300,s:10,v:0,u:'mm'}],
run:v=>{const D=[[30,60,90,70,25,8,3,0,0,2,5,12],[80,120,200,170,80,25,10,2,1,3,8,30],[140,200,300,260,140,50,20,5,3,6,15,60],[10,30,280,20,5,0,0,0,0,0,10,15]][v.ano].slice();D[2]+=v.x;const tot=D.reduce((a,b)=>a+b,0),me=tot/12,so=[...D].sort((a,b)=>a-b),md=(so[5]+so[6])/2,dp=Math.sqrt(D.reduce((a,b)=>a+(b-me)**2,0)/12),sec=D.filter(x=>x<10).length;return{D,me,md,big:br(tot,0)+' mm',bl:'Chuva no ano',st:tot<500?['bad','Ano de seca']:tot<800?['warn','Ano regular']:['ok','Bom inverno'],m:[['Média mensal',br(me)+' mm'],['Mediana',br(md)+' mm'],['Desvio padrão',br(dp)+' mm'],['Meses secos (< 10 mm)',sec]],fx:`média = ${br(tot,0)} ÷ 12 ≈ ${br(me)} mm · mediana = (${so[5]} + ${so[6]}) ÷ 2 = ${br(md)} mm`}},
draw:(v,r)=>{const x0=70,x1=770,y0=360,y1=50,mx=Math.max(320,...r.D),bw=(x1-x0)/12,Y=x=>y0-(y0-y1)*x/mx;let b='';r.D.forEach((d,i)=>{b+=`<rect x="${x0+i*bw+6}" y="${Y(d)}" width="${bw-12}" height="${y0-Y(d)}" rx="4" fill="var(--water)"/>${T(x0+i*bw+bw/2,y0+28,'JFMAMJJASOND'[i],20,'middle','var(--soft)',400)}`});
return `<rect width="800" height="420" fill="var(--card)"/>`+b+`<path d="M${x0} ${y0} H${x1}" stroke="var(--dark)" stroke-width="2"/><path d="M${x0} ${Y(r.me)} H${x1}" stroke="var(--red)" stroke-width="4" stroke-dasharray="12 8"/><path d="M${x0} ${Y(r.md)} H${x1}" stroke="var(--gold)" stroke-width="4" stroke-dasharray="4 6"/>${T(x1,y1-14,'— média',20,'end','var(--redt)')}${T(x1-150,y1-14,'··· mediana',20,'end','var(--goldt)')}${T(x0-8,y1+6,mx,16,'end','var(--soft)',400)}${T(x0-8,y0,'0 mm',16,'end','var(--soft)',400)}`},
q:{p:'As chuvas, em mm, de cinco meses foram: 10, 20, 20, 30 e 170. Sobre esses dados, é correto afirmar que',o:['a média e a mediana valem 20','a média é 50 e a mediana é 20','a média é 20 e a mediana é 50','a moda é 170','a mediana é 30'],a:1,e:'Média = 250 ÷ 5 = 50. Com os dados em ordem, o valor do meio é 20. O mês de 170 mm puxa a média para cima, mas não muda a mediana.'}},

{id:'volume-cisterna',d:'Matemática',t:'Construindo a cisterna de placas',enem:'Geometria espacial: volume do cilindro',
ctx:'A cisterna de placas guarda a água da chuva que escorre do telhado. Ajuste o diâmetro e a altura e descubra quantos litros cabem e quanta chuva o telhado precisa captar para enchê-la.',
con:'A cisterna é um cilindro: <b>V = π·r²·h</b>. Cada 1 m³ guarda 1 000 L. A chuva é medida em milímetros: 1 mm caindo sobre 1 m² de telhado dá 1 litro. Por isso, <b>chuva necessária (mm) = litros ÷ área do telhado (m²)</b>.',
c:[{id:'d',l:'Diâmetro',min:2,max:6,s:.1,v:3.4,u:'m'},{id:'h',l:'Altura',min:1,max:3,s:.1,v:1.8,u:'m'},{id:'A',l:'Área do telhado',min:20,max:200,s:5,v:60,u:'m²'}],
run:v=>{const r=v.d/2,V=Math.PI*r*r*v.h,L=V*1000;return{L,big:br(L,0)+' L',bl:'Capacidade da cisterna',st:L>=16000?['ok','Atende o padrão de 16 mil litros']:['warn',`Faltam ${br(16000-L,0)} L para chegar a 16 mil`],m:[['Raio',br(r,2)+' m'],['Área da base',br(Math.PI*r*r,2)+' m²'],['Chuva para encher',br(L/v.A,0)+' mm'],['Família de 4 (80 L/dia)',br(L/80,0)+' dias']],fx:`V = π · ${br(r,2)}² · ${br(v.h)} ≈ ${br(V,2)} m³ = ${br(L,0)} L`}},
draw:(v,r)=>{const sc=60,w=v.d*sc,h=v.h*sc,cx=520,G=330,top=G-h*.6,ry=w*.18;return sky+sun(720,60,28)+`<path d="M40 210 L150 150 L260 210z" fill="var(--red)"/><rect x="60" y="210" width="180" height="${G-210}" fill="var(--tank)" stroke="var(--dark)" stroke-width="3"/><rect x="130" y="260" width="40" height="${G-260}" fill="var(--dark)"/><path d="M40 214 H260 M250 214 Q${cx-w/2-30} 214 ${cx-w/4} ${top-ry/2}" stroke="var(--dark)" stroke-width="5" fill="none"/>`+ground(G)+`<path d="M${cx-w/2} ${top} V${top+h} a${w/2} ${ry} 0 0 0 ${w} 0 V${top}" fill="var(--tank)" stroke="var(--dark)" stroke-width="4"/><ellipse cx="${cx}" cy="${top}" rx="${w/2}" ry="${ry}" fill="var(--water)" stroke="var(--dark)" stroke-width="4"/><g stroke="var(--red)" stroke-width="3"><path d="M${cx-w/2} ${top-ry-20} H${cx+w/2}"/><path d="M${cx+w/2+18} ${top} V${top+h}"/></g>${T(cx,top-ry-30,'d = '+br(v.d)+' m',22,'middle','var(--redt)')}${T(cx+w/2+26,top+h/2,'h = '+br(v.h)+' m',22,'start','var(--redt)')}`},
q:{p:'Uma cisterna cilíndrica tem 2 m de raio e 1,5 m de altura. Usando π = 3, sua capacidade é de',o:['6 000 L','9 000 L','12 000 L','18 000 L','24 000 L'],a:3,e:'V = 3 · 2² · 1,5 = 18 m³, e 18 m³ = 18 000 L.'}},

{id:'aluguel-trator',d:'Matemática',t:'Qual trator alugar?',enem:'Função afim (1º grau)',
ctx:'Na hora de preparar a terra, dois donos de trator fazem propostas diferentes: um cobra deslocamento mais um valor por hora, o outro só por hora. Qual compensa para o seu serviço?',
con:'Cada proposta é uma <b>função afim</b>: <b>f(x) = a·x + b</b>, em que b é o valor fixo e a é o preço por hora. No gráfico, são retas. Onde elas se cruzam, os custos empatam: basta igualar as duas funções e resolver a equação.',
c:[{id:'x',l:'Horas de serviço',min:1,max:20,s:1,v:6,u:'h'},{id:'f',l:'Deslocamento do trator A',min:0,max:400,s:10,v:200,u:'R$'},{id:'pa',l:'Hora do trator A',min:50,max:200,s:10,v:80,u:'R$'},{id:'pb',l:'Hora do trator B',min:50,max:250,s:10,v:120,u:'R$'}],
run:v=>{const A=v.f+v.pa*v.x,B=v.pb*v.x,xs=v.pb>v.pa?v.f/(v.pb-v.pa):null,best=A<B?'Trator A':B<A?'Trator B':'Empate';return{A,B,xs,big:best,bl:`Mais barato para ${v.x} h de serviço`,st:xs===null?['warn','O trator B é sempre mais barato']:['ok',`Os dois empatam em ${br(xs)} h. Acima disso, o A compensa`],m:[['Custo do trator A','R$ '+br(A,2)],['Custo do trator B','R$ '+br(B,2)],['Economia','R$ '+br(Math.abs(A-B),2)],['Ponto de empate',xs===null?'não há':br(xs)+' h']],fx:`A(x) = ${v.pa}·x + ${v.f} · B(x) = ${v.pb}·x`}},
draw:(v,r)=>{const x0=100,x1=740,y0=350,y1=70,mx=Math.max(v.f+v.pa*20,v.pb*20),X=h=>x0+(x1-x0)*h/20,Y=c=>y0-(y0-y1)*c/mx;let tk='';for(let h=0;h<=20;h+=5)tk+=T(X(h),y0+28,h,18,'middle','var(--soft)',400);
return `<rect width="800" height="420" fill="var(--card)"/><path d="M${x0} ${y1} V${y0} H${x1}" stroke="var(--dark)" stroke-width="2" fill="none"/>${tk}${T((x0+x1)/2,y0+56,'horas',18,'middle','var(--soft)',400)}${T(x0-8,y1+6,'R$ '+br(mx,0),16,'end','var(--soft)',400)}<path d="M${X(v.x)} ${y1} V${y0}" stroke="var(--soft)" stroke-dasharray="6 6" stroke-width="2"/><path d="M${X(0)} ${Y(v.f)} L${X(20)} ${Y(v.f+v.pa*20)}" stroke="var(--red)" stroke-width="5"/><path d="M${X(0)} ${Y(0)} L${X(20)} ${Y(v.pb*20)}" stroke="var(--gold)" stroke-width="5"/><circle cx="${X(v.x)}" cy="${Y(r.A)}" r="8" fill="var(--red)"/><circle cx="${X(v.x)}" cy="${Y(r.B)}" r="8" fill="var(--gold)"/>${r.xs!==null&&r.xs<=20?`<circle cx="${X(r.xs)}" cy="${Y(v.pb*r.xs)}" r="10" fill="none" stroke="var(--dark)" stroke-width="3"/>`:''}<rect x="${x0+10}" y="30" width="22" height="8" fill="var(--red)"/>${T(x0+40,40,'Trator A',20)}<rect x="${x0+170}" y="30" width="22" height="8" fill="var(--gold)"/>${T(x0+200,40,'Trator B',20)}`},
q:{p:'Para arar um terreno, o trator A cobra R$ 100,00 de deslocamento mais R$ 80,00 por hora, e o trator B cobra R$ 100,00 por hora, sem taxa fixa. Os dois custam o mesmo para um serviço de',o:['2 horas','4 horas','5 horas','8 horas','10 horas'],a:2,e:'100 + 80x = 100x, então 20x = 100 e x = 5 horas.'}},

{id:'preco-do-queijo',d:'Matemática',t:'O melhor preço do queijo',enem:'Função quadrática: vértice da parábola',
ctx:'Se o queijo coalho fica caro, vende pouco. Se fica barato, vende muito, mas sobra pouco por quilo. Existe um preço que dá o maior lucro. Encontre esse preço!',
con:'Neste exemplo, a queijeira vende <b>120 − 2p</b> quilos por semana quando cobra p reais o quilo, e o lucro é <b>L(p) = (p − c)·(120 − 2p)</b>, sendo c o custo por quilo. O gráfico é uma parábola com a concavidade para baixo. O lucro máximo fica no <b>vértice</b>, exatamente no meio das duas raízes: <b>p = (c + 60) ÷ 2</b>.',
c:[{id:'p',l:'Preço do quilo',min:20,max:60,s:1,v:32,u:'R$'},{id:'c',l:'Custo por quilo',min:10,max:30,s:1,v:18,u:'R$'}],
run:v=>{const L=p=>(p-v.c)*(120-2*p),pv=(v.c+60)/2,l=L(v.p),lm=L(pv);return{L,pv,l,lm,big:'R$ '+br(l,2),bl:'Lucro por semana',st:l<0?['bad','Prejuízo: o preço está abaixo do custo']:Math.abs(v.p-pv)<=1?['ok','Preço ótimo: lucro máximo!']:['warn',`O lucro máximo é R$ ${br(lm,0)} com o quilo a R$ ${br(pv,0)}`],m:[['Venda por semana',br(120-2*v.p,0)+' kg'],['Ganho por quilo','R$ '+br(v.p-v.c,2)],['Preço ideal (vértice)','R$ '+br(pv,2)],['Lucro máximo','R$ '+br(lm,2)]],fx:`L(${v.p}) = (${v.p} − ${v.c}) · (120 − 2·${v.p}) = R$ ${br(l,0)}`}},
draw:(v,r)=>{const x0=100,x1=740,y0=330,y1=60,mx=Math.max(r.lm,1)*1.1,mn=-mx*.25,X=p=>x0+(x1-x0)*(p-20)/40,Y=l=>y0-(y0-y1)*(l-mn)/(mx-mn);let pts='';for(let p=20;p<=60;p+=.5)pts+=`${X(p)},${Y(r.L(p))} `;let tk='';for(let p=20;p<=60;p+=10)tk+=T(X(p),y0+50,'R$ '+p,18,'middle','var(--soft)',400);
return `<rect width="800" height="420" fill="var(--card)"/><path d="M${x0} ${y1} V${y0+20} M${x0} ${Y(0)} H${x1}" stroke="var(--dark)" stroke-width="2" fill="none"/>${tk}${T((x0+x1)/2,y0+80,'preço do quilo',18,'middle','var(--soft)',400)}${T(x0-8,Y(0)+6,'0',16,'end','var(--soft)',400)}<polyline points="${pts}" fill="none" stroke="var(--dark)" stroke-width="4"/><path d="M${X(r.pv)} ${Y(r.lm)} V${Y(0)}" stroke="var(--gold)" stroke-width="3" stroke-dasharray="6 6"/><circle cx="${X(r.pv)}" cy="${Y(r.lm)}" r="10" fill="var(--gold)"/>${T(X(r.pv),Y(r.lm)-20,'vértice',20,'middle','var(--goldt)')}<circle cx="${X(v.p)}" cy="${Y(r.l)}" r="10" fill="var(--red)"/>`},

{id:'germinacao',d:'Matemática',t:'Quantas sementes por cova?',enem:'Probabilidade: evento complementar',

con:'Se cada semente germina com probabilidade p, a chance de <b>todas</b> as k sementes falharem é (1 − p)<sup>k</sup>. A chance de <b>pelo menos uma</b> nascer é o complementar: <b>P = 1 − (1 − p)<sup>k</sup></b>. Cada semente a mais aumenta pouco a chance, mas gasta mais semente.',
