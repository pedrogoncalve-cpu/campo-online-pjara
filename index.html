con:'Parar tem duas partes. Na <b>reação</b> a moto ainda anda na mesma velocidade: <b>d = v·t</b>. Na <b>frenagem</b> o atrito freia: <b>d = v²/(2·μ·g)</b>. Como a velocidade está ao quadrado, andar duas vezes mais rápido quadruplica a frenagem. Chão de terra ou lama tem menos atrito (μ menor).',
c:[{id:'v',l:'Velocidade',min:20,max:90,s:5,v:50,u:'km/h'},{id:'tr',l:'Tempo de reação',min:.5,max:2.5,s:.1,v:1,u:'s'},{id:'D',l:'Distância até a vaca',min:15,max:80,s:1,v:40,u:'m'},{id:'mu',l:'Chão',opts:[[.7,'Asfalto seco'],[.5,'Estrada de terra'],[.25,'Lama']],v:.5}],
run:v=>{const s=v.v/3.6,dr=s*v.tr,df=s*s/(2*v.mu*9.8),tot=dr+df,tb=s/(v.mu*9.8);return{s,dr,df,tot,tb,big:br(tot,1)+' m',bl:'Distância para parar',st:tot<v.D?['ok',`Parou a ${br(v.D-tot,1)} m da vaca`]:['bad','Não dá tempo: vai bater!'],m:[['Durante a reação',br(dr,1)+' m'],['Freando',br(df,1)+' m'],['Velocidade',br(s,1)+' m/s'],['Tempo freando',br(tb,1)+' s']],fx:`d = ${br(s,1)}·${br(v.tr)} + ${br(s,1)}² / (2·${br(v.mu,2)}·9,8) ≈ ${br(tot,1)} m`}},
draw:(v,r,t)=>{const G=300,x0=60,sc=680/Math.max(v.D+10,r.tot*1.05),cyc=r.tr+r.tb+2,tt=PH(t,cyc)*cyc;let x;if(tt<v.tr)x=r.s*tt;else if(tt<v.tr+r.tb){const u=tt-v.tr;x=r.dr+r.s*u-.5*v.mu*9.8*u*u}else x=r.tot;const px=x0+x*sc,stop=tt>v.tr,vx=x0+v.D*sc,hit=r.tot>=v.D&&x>=v.D-1,X=hit?Math.min(px,vx-20):px,wr=(x*40)%360;
return sky+SUN(720,50,22,t,.6)+`<rect y="${G}" width="800" height="70" fill="${v.mu<.3?'#6b4a2a':v.mu<.6?'#c98b4a':'#4a4744'}"/><path d="M0 ${G+35} H800" stroke="#f3efe6" stroke-width="3" stroke-dasharray="20 16"/><rect y="${G+70}" width="800" height="50" fill="var(--ground2)"/><rect x="${x0}" y="${G+76}" width="${r.dr*sc}" height="14" fill="var(--gold)"/><rect x="${x0+r.dr*sc}" y="${G+76}" width="${r.df*sc}" height="14" fill="var(--red)"/>${T(x0,G+112,'reação',16,'start','#fff',400)}${T(x0+r.dr*sc+4,G+112,'freando',16,'start','#fff',400)}<g transform="translate(${vx} ${G-4})"><rect x="0" y="-50" width="70" height="36" rx="12" fill="#fffaf0" stroke="var(--dark)" stroke-width="3"/><circle cx="20" cy="-36" r="7" fill="var(--dark)"/><circle cx="48" cy="-28" r="8" fill="var(--dark)"/><path d="M10 -14 v14 M24 -14 v14 M50 -14 v14 M62 -14 v14" stroke="var(--dark)" stroke-width="5"/><ellipse cx="78" cy="-50" rx="14" ry="11" fill="#fffaf0" stroke="var(--dark)" stroke-width="3"/><path d="M72 -60 l-4 -8 M86 -60 l4 -8" stroke="var(--dark)" stroke-width="3"/></g><g transform="translate(${X.toFixed(1)} ${G-4})"><g transform="rotate(${wr.toFixed(0)} -22 -14)"><circle cx="-22" cy="-14" r="14" fill="none" stroke="var(--dark)" stroke-width="5"/><path d="M-22 -28 V0 M-36 -14 H-8" stroke="var(--dark)" stroke-width="2"/></g><g transform="rotate(${wr.toFixed(0)} 22 -14)"><circle cx="22" cy="-14" r="14" fill="none" stroke="var(--dark)" stroke-width="5"/><path d="M22 -28 V0 M8 -14 H36" stroke="var(--dark)" stroke-width="2"/></g><path d="M-22 -14 L-4 -34 H18 L22 -14 M18 -34 l6 -12" stroke="var(--red)" stroke-width="7" fill="none" stroke-linejoin="round"/><circle cx="2" cy="-58" r="10" fill="var(--red)" stroke="var(--dark)" stroke-width="3"/><path d="M0 -48 L-6 -34" stroke="var(--dark)" stroke-width="6"/></g>${stop&&tt<v.tr+r.tb?T(X,G-80,'freando!',20,'middle','var(--redt)'):''}${hit?T(vx,G-110,'PÁ!',34,'middle','var(--redt)'):''}`},
q:{p:'A distância de frenagem de um veículo é proporcional ao quadrado da sua velocidade. Se a velocidade dobra, a distância de frenagem',o:['fica igual','dobra','triplica','quadruplica','cai pela metade'],a:3,e:'d = v²/(2μg). Com 2v, a distância vira (2v)² = 4v²: quatro vezes maior.'}},

{id:'trovao',d:'Física',t:'A que distância está o raio?',enem:'Ondas sonoras: velocidade do som',
ctx:'No inverno, o povo do sertão conta os segundos entre o clarão e o trovão para saber se a chuva vem perto. Será que a conta funciona?',
con:'A luz chega quase na hora (300 mil km por segundo). O som é bem mais lento: cerca de <b>340 m/s</b>, um pouco mais rápido no ar quente (v ≈ 331 + 0,6·T). Por isso a distância é <b>d = v·Δt</b>: a cada 3 segundos, cerca de 1 km. Se o trovão vem em menos de 10 segundos, procure abrigo.',
c:[{id:'dt',l:'Segundos até o trovão',min:1,max:20,s:1,v:6,u:'s'},{id:'T',l:'Temperatura do ar',min:10,max:40,s:1,v:30,u:'°C'}],
run:v=>{const s=331+.6*v.T,d=s*v.dt;return{s,d,big:br(d/1000,1)+' km',bl:'Distância do raio',st:v.dt<10?['bad','Tempestade perto: procure abrigo!']:v.dt<20?['warn','Ela pode chegar logo']:['ok','Ainda longe'],m:[['Velocidade do som',br(s,0)+' m/s'],['Distância',br(d,0)+' m'],['A luz chegou em',br(d/3e8*1e6,1)+' µs'],['Regra do povo',br(v.dt/3,1)+' km']],fx:`d = v·Δt = ${br(s,0)} · ${v.dt} ≈ ${br(d,0)} m`}},
draw:(v,r,t)=>{const G=330,hx=110,lx=hx+cl(r.d/7000,.08,1)*600,cyc=v.dt+2,tt=PH(t,cyc)*cyc,fl=tt<.25,wr=Math.min(tt,v.dt)/v.dt*(lx-hx);let wv='';if(tt<v.dt)for(let i=0;i<3;i++){const rr=Math.max(0,wr-i*16);wv+=`<path d="M${lx-rr} ${G-60} a${rr} ${rr*.6} 0 0 1 0 ${-1}" stroke="var(--gold)" stroke-width="4" fill="none" opacity="${(.9-i*.25).toFixed(2)}"/><circle cx="${lx}" cy="${G-40}" r="${rr.toFixed(1)}" fill="none" stroke="var(--gold)" stroke-width="${4-i}" opacity="${(.7-i*.2).toFixed(2)}"/>`}
return `<rect width="800" height="420" fill="${fl?'#fff8d6':'#3a3f4a'}"/>`+CLOUD(lx,60,1.8).replace('#fffaf0','#5b6170')+`<rect y="${G}" width="800" height="90" fill="var(--ground2)"/>${fl?`<path d="M${lx} 80 l-30 90 h28 l-36 ${G-210} l70 -110 h-30 l30 -70z" fill="#ffe66d" stroke="#fff" stroke-width="3"/>`:''}${wv}<path d="M${hx-50} ${G-70} L${hx} ${G-110} L${hx+50} ${G-70}z" fill="var(--red)"/><rect x="${hx-40}" y="${G-70}" width="80" height="70" fill="var(--tank)" stroke="var(--dark)" stroke-width="3"/>${T(400,40,tt<v.dt?'contando: '+Math.floor(tt)+' s':'TROVÃO!',30,'middle',tt<v.dt?'#fff':'var(--gold)')}${T((hx+lx)/2,G+50,br(r.d/1000,1)+' km',24,'middle','#fff')}`},
q:{p:'Um agricultor viu um relâmpago e ouviu o trovão 5 segundos depois. Considerando a velocidade do som igual a 340 m/s, a distância até o raio é de aproximadamente',o:['68 m','340 m','850 m','1 700 m','3 400 m'],a:3,e:'d = v·t = 340 · 5 = 1 700 m. A luz chega praticamente na hora, então o atraso é todo do som.'}},

{id:'canoa-no-acude',d:'Física',t:'A canoa no açude',enem:'Hidrostática: empuxo (Arquimedes)',
ctx:'O pescador quer levar o máximo de peixe na canoa sem afundar. Até quanto dá para carregar?',
con:'A água empurra para cima tudo o que está mergulhado: é o <b>empuxo</b>, <b>E = ρ·V·g</b>, igual ao peso da água deslocada. A canoa flutua enquanto o empuxo máximo (com ela toda submersa) for maior que o peso total. Água salgada é mais densa e empurra um pouco mais.',
c:[{id:'V',l:'Volume da canoa',min:.2,max:1.5,s:.05,v:.6,u:'m³'},{id:'mc',l:'Massa da canoa',min:20,max:100,s:5,v:40,u:'kg'},{id:'ca',l:'Carga (gente e peixe)',min:0,max:600,s:10,v:200,u:'kg'},{id:'rho',l:'Água',opts:[[1000,'Doce (açude)'],[1025,'Salgada (mar)']],v:1000}],
run:v=>{const M=v.mc+v.ca,f=M/(v.rho*v.V),Em=v.rho*v.V*9.8,cm=v.rho*v.V-v.mc;return{f,big:f>=1?'Afundou!':Math.round(f*100)+'% submersa',bl:'Quanto da canoa fica dentro d’água',st:f<.7?['ok','Navega com folga']:f<1?['warn','Quase na borda: cuidado com as ondas']:['bad','Afundou: carga demais'],m:[['Empuxo máximo',br(Em,0)+' N'],['Peso total',br(M*9.8,0)+' N'],['Carga máxima',br(Math.max(cm,0),0)+' kg'],['Folga',br(Math.max(cm-v.ca,0),0)+' kg']],fx:`E<sub>máx</sub> = ρ·V·g = ${v.rho} · ${br(v.V,2)} · 9,8 ≈ ${br(Em,0)} N`}},
draw:(v,r,t)=>{const W=260+v.V*140,H=70,wl=240,cx=400,f=cl(r.f,0,1.6),bob=Math.sin(t*1.6)*4,sink=r.f>=1,top=wl-H+f*H+bob+(sink?Math.min(120,PH(t,5)*240):0),n=Math.min(8,Math.round(v.ca/60));let load='';for(let i=0;i<n;i++)load+=i%2?`<circle cx="${cx-W/2+40+i*(W-80)/8}" cy="${top-18}" r="12" fill="var(--red)" stroke="var(--dark)" stroke-width="2"/>`:`<path d="M${cx-W/2+28+i*(W-80)/8} ${top-6} q14 -14 28 0 q-14 14 -28 0z M${cx-W/2+56+i*(W-80)/8} ${top-6} l8 -6 v12z" fill="var(--water)" stroke="var(--dark)" stroke-width="2"/>`;let bb='';if(sink)for(let i=0;i<6;i++){const p=PH(t,1.4,i/6);bb+=`<circle cx="${cx-60+i*24}" cy="${(top-p*80).toFixed(1)}" r="5" fill="none" stroke="#fff" stroke-width="2" opacity="${(1-p).toFixed(2)}"/>`}let rp='';for(let i=0;i<3;i++){const p=PH(t,2.5,i/3);rp+=`<ellipse cx="${cx}" cy="${wl}" rx="${(W/2+p*120).toFixed(1)}" ry="${(8+p*10).toFixed(1)}" fill="none" stroke="#fff" stroke-width="2" opacity="${(.6*(1-p)).toFixed(2)}"/>`}
return sky+SUN(700,60,24,t,.7)+`<rect y="${wl}" width="800" height="${420-wl}" fill="var(--water)" opacity=".85"/>`+rp+`<path d="M${cx-W/2} ${top} Q${cx} ${top+H*1.6} ${cx+W/2} ${top} z" fill="#7a4a21" stroke="var(--dark)" stroke-width="4"/>${load}<rect y="${wl}" width="800" height="${420-wl}" fill="var(--water)" opacity=".35"/>${bb}<path d="M0 ${wl} H800" stroke="#fff" stroke-width="2" opacity=".7"/>`},
q:{p:'Uma canoa de 50 kg com volume de 0,4 m³ flutua num açude (densidade da água: 1 000 kg/m³). A maior carga que ela suporta sem afundar é',o:['50 kg','150 kg','350 kg','400 kg','450 kg'],a:2,e:'O empuxo máximo equivale a 1 000 · 0,4 = 400 kg de água. Tirando os 50 kg da canoa, sobram 350 kg de carga.'}},

{id:'leite-azedo',d:'Química',t:'Por que o leite azeda mais rápido no calor?',enem:'Cinética química: temperatura e velocidade',
ctx:'Leite tirado de manhã e deixado fora da geladeira no calor do sertão azeda antes da tarde. Na geladeira, dura dias. Veja a temperatura mudando a velocidade.',
con:'Bactérias transformam a lactose do leite em ácido lático, e o leite talha. Como toda reação, ela fica mais rápida com o calor: uma regra prática diz que a velocidade <b>dobra a cada 10 °C</b>, <b>v₂ = v₁·2<sup>(T₂−T₁)/10</sup></b>. Ferver o leite mata a maioria das bactérias e o faz durar mais.',
c:[{id:'T',l:'Temperatura',min:4,max:40,s:1,v:30,u:'°C'},{id:'b',l:'Leite',opts:[[1,'Cru'],[.25,'Fervido']],v:1}],
run:v=>{const h=8*Math.pow(2,(30-v.T)/10)/v.b,vr=Math.pow(2,(v.T-30)/10);return{h,big:h<48?br(h,0)+' h':br(h/24,1)+' dias',bl:'Tempo até o leite azedar',st:h>=48?['ok','Aguenta mais de 2 dias']:h>=12?['warn','Aguenta só um dia']:['bad','Azeda em poucas horas'],m:[['Velocidade vs 30 °C',br(vr,2)+' ×'],['A cada +10 °C','2 × mais rápido'],['Leite',v.b===1?'cru':'fervido'],['Lugar',v.T<10?'geladeira':'fora dela']],fx:`t = 8 h · 2<sup>(30 − ${Math.round(v.T)})/10</sup>${v.b===1?'':' ÷ 0,25'} ≈ ${br(h,1)} h`}},
draw:(v,r,t)=>{const fr=v.T<10,ph=PH(t,8),hrs=ph*r.h*1.3,az=hrs>=r.h,n=Math.min(70,Math.round(3*Math.pow(2,6*hrs/r.h)));let bac='';for(let i=0;i<n;i++)bac+=`<ellipse cx="${(330+(i*37)%140+Math.sin(t*3+i)*3).toFixed(1)}" cy="${(170+(i*53)%170+Math.cos(t*2+i)*3).toFixed(1)}" rx="5" ry="3" fill="${az?'#8a8f2a':'#7cbf4a'}" transform="rotate(${(i*40)%180} ${330+(i*37)%140} ${170+(i*53)%170})"/>`;let lumps='';if(az)for(let i=0;i<8;i++)lumps+=`<circle cx="${340+(i*29)%120}" cy="${180+(i*41)%120}" r="${9+i%3*3}" fill="#f3e9c6" stroke="#d9cfa8" stroke-width="2"/>`;
return `<rect width="800" height="420" fill="${fr?'#d6ecf5':'var(--sky)'}"/>${fr?'<rect x="200" y="20" width="400" height="390" rx="20" fill="none" stroke="#9ec9dc" stroke-width="10"/>':SUN(700,60,26,t)}<rect y="380" width="800" height="40" fill="var(--ground2)"/><path d="M320 120 h160 v20 q20 10 20 40 v190 q0 20 -20 20 h-160 q-20 0 -20 -20 v-190 q0 -30 20 -40z" fill="#fffdf6" stroke="var(--dark)" stroke-width="4"/>${lumps}${bac}<rect x="330" y="96" width="140" height="26" rx="6" fill="var(--red)"/>`+thermo(660,v.T,Math.round(v.T)+' °C')+T(160,120,'⏱ '+br(hrs,hrs<10?1:0)+' h',30,'middle','var(--ink)')+T(160,160,az?'azedou!':'ainda bom',22,'middle',az?'var(--redt)':'var(--leaft)')},
q:{p:'Guardar o leite na geladeira faz com que ele demore mais para azedar porque a baixa temperatura',o:['mata todas as bactérias do leite','diminui a velocidade das reações químicas e da multiplicação das bactérias','aumenta a acidez do leite','retira o oxigênio do leite','transforma a lactose em gordura'],a:1,e:'O frio não mata as bactérias, mas deixa tudo mais lento: a multiplicação delas e a reação que produz o ácido lático.'}},

{id:'ferrugem',d:'Química',t:'A ferrugem no arame da cerca',enem:'Oxirredução e corrosão',
ctx:'O arame da cerca enferruja e arrebenta. Perto do mar é ainda pior. Compare o arame comum com o galvanizado, coberto de zinco.',
con:'A ferrugem é uma <b>oxidação</b>: o ferro perde elétrons para o oxigênio, com ajuda da água: <b>4 Fe + 3 O<sub>2</sub> + 6 H<sub>2</sub>O → 4 Fe(OH)<sub>3</sub></b>. Sal no ar (maresia) acelera muito a reação. No arame galvanizado, o <b>zinco</b> se oxida no lugar do ferro: é o <b>metal de sacrifício</b>. Valores ilustrativos.',
c:[{id:'U',l:'Umidade do ar',min:20,max:100,s:5,v:70,u:'%'},{id:'an',l:'Tempo',min:1,max:20,s:1,v:6,u:'anos'},{id:'sa',l:'Lugar',opts:[[1,'Sertão (sem sal no ar)'],[4,'Perto do mar (maresia)']],v:1},{id:'g',l:'Arame',opts:[[0,'Comum'],[1,'Galvanizado (zinco)']],v:0}],
run:v=>{const r=.08*(v.U/100)**2*v.sa,pz=v.g?Math.min(40,6/(v.sa*(v.U/100)**2)):0,ef=Math.max(0,v.an-pz),loss=cl(100*r*ef,0,100);return{loss,pz,big:Math.round(loss)+'%',bl:'Arame corroído',st:loss<15?['ok','Arame firme']:loss<50?['warn','Enferrujando: trocar em breve']:['bad','Arame vai arrebentar'],m:[['Corrosão por ano',br(r*100,1)+'%'],['Zinco protege por',v.g?br(pz,1)+' anos':'sem zinco'],['Anos enferrujando',br(ef,1)],['Umidade',Math.round(v.U)+'%']],fx:'4 Fe + 3 O<sub>2</sub> + 6 H<sub>2</sub>O → 4 Fe(OH)<sub>3</sub>'}},
draw:(v,r,t)=>{const L=r.loss/100,mix=(a,b)=>a.map((c,i)=>Math.round(c+(b[i]-c)*L)),col=`rgb(${mix([160,166,175],[150,72,30]).join(',')})`;let w='',fl='',dr='';for(let k=0;k<3;k++){const y=150+k*70;w+=`<path d="M60 ${y} H740" stroke="${col}" stroke-width="5"/>`;for(let x=90;x<740;x+=60)w+=`<path d="M${x-8} ${y-8} l16 16 M${x+8} ${y-8} l-16 16" stroke="${col}" stroke-width="4"/>`}for(let i=0;i<Math.round(L*20);i++){const p=PH(t,2.5,i*.13);fl+=`<rect x="${80+(i*67)%640}" y="${(160+(i%3)*70+p*160).toFixed(1)}" width="5" height="4" fill="#96481e" opacity="${(1-p).toFixed(2)}"/>`}for(let i=0;i<Math.round(v.U/12);i++){const p=PH(t,3,i*.21);dr+=`<circle cx="${100+(i*83)%600}" cy="${(156+(i%3)*70+p*12).toFixed(1)}" r="${2+p*2}" fill="var(--water)" opacity="${(1-p).toFixed(2)}"/>`}
return sky+(v.sa>1?`<path d="M0 300 ${Array.from({length:9},(_,i)=>`Q${i*100+50} ${300+Math.sin(t*2+i)*10} ${i*100+100} 300`).join(' ')} V420 H0z" fill="var(--water)" opacity=".7"/>`:SUN(700,60,26,t))+`<rect y="330" width="800" height="90" fill="var(--ground)"/>${[60,400,740].map(x=>`<rect x="${x-9}" y="110" width="18" height="230" fill="#7a4a21" stroke="var(--dark)" stroke-width="2"/>`).join('')}`+w+fl+dr+T(400,60,v.g&&v.an<=r.pz?'zinco ainda protegendo':(Math.round(r.loss)+'% corroído'),26,'middle','var(--ink)')},
q:{p:'O arame galvanizado demora mais para enferrujar porque é coberto de zinco, que',o:['é mais nobre que o ferro e não reage com nada','se oxida no lugar do ferro, protegendo-o como metal de sacrifício','impede a passagem da luz do sol','neutraliza o sal da maresia','transforma a ferrugem de volta em ferro'],a:1,e:'O zinco tem mais tendência a se oxidar que o ferro, então ele é corroído primeiro e protege o arame.'}},

{id:'dessalinizador',d:'Química',t:'Dessalinizador solar: água doce da salobra',enem:'Separação de misturas: destilação',
ctx:'Água de poço salobra não serve para beber. Uma caixa com tampa de vidro ao sol transforma essa água em água doce. Quantos litros por dia?',
con:'O sol aquece a água salobra, a água <b>evapora</b> e o sal fica para trás. O vapor <b>condensa</b> no vidro, mais frio, e escorre para o coletor: é uma <b>destilação</b>. Evaporar 1 kg de água exige cerca de 2,4 milhões de joules, por isso a produção depende da área de vidro e da força do sol.',
c:[{id:'A',l:'Área do vidro',min:.5,max:4,s:.5,v:1,u:'m²'},{id:'S',l:'Sol do dia',min:3,max:7,s:.5,v:5.5,u:'kWh/m²'},{id:'e',l:'Rendimento',min:20,max:50,s:5,v:35,u:'%'},{id:'C',l:'Sal na água do poço',min:1,max:10,s:1,v:3,u:'g/L'}],
run:v=>{const E=v.A*v.S*3.6e6,L=E*v.e/100/2.4e6;return{L,big:br(L,1)+' L/dia',bl:'Água doce produzida',st:L>=8?['ok','Dá para a família beber']:L>=2?['warn',`Dá para ${Math.floor(L/2)} pessoa${L>=4?'s':''} beber`]:['bad','Pouca água: aumente o vidro'],m:[['Energia do sol',br(E/1e6,1)+' MJ'],['Pessoas (2 L cada)',br(Math.floor(L/2),0)],['Sal que fica na caixa',br(L*v.C,0)+' g/dia'],['Sal na água produzida','quase zero']],fx:`m = E·η / L = ${br(E/1e6,1)} MJ · ${br(v.e/100,2)} / 2,4 MJ ≈ ${br(L,1)} kg`}},
draw:(v,r,t)=>{const w=200+v.A*90,x0=400-w/2,x1=400+w/2,yb=330,yt=200;let vap='',dr='';for(let i=0;i<10;i++){const p=PH(t,2.6-v.S/5,i/10),x=x0+30+(i*61)%(w-60);vap+=`<path d="M${x} ${(yb-20-p*90).toFixed(1)} q6 -8 0 -16" stroke="#fff" stroke-width="3" fill="none" opacity="${(Math.sin(p*Math.PI)*.9).toFixed(2)}"/>`}for(let i=0;i<6;i++){const p=PH(t,2,i/6),xs=x0+20+(i*53)%(w-60),x=xs+(x1-10-xs)*p,y=yt+20+(yt+70-yt-20)*0+((x-x0)/(x1-x0))*60-10;dr+=`<circle cx="${x.toFixed(1)}" cy="${(yt+(x-x0)/w*60+8).toFixed(1)}" r="5" fill="var(--water)"/>`}const fill=cl(PH(t,10)*1.2,0,1);let salt='';for(let i=0;i<v.C*3;i++)salt+=`<rect x="${x0+20+(i*37)%(w-40)}" y="${yb-6}" width="6" height="6" fill="#fffaf0" transform="rotate(45 ${x0+23+(i*37)%(w-40)} ${yb-3})"/>`;
return sky+SUN(110,70,22+v.S*3,t)+ground(360)+`<path d="M${x0} ${yt} L${x1} ${yt+60} V${yb+10} H${x0}z" fill="#3a2d22" stroke="var(--dark)" stroke-width="4"/><rect x="${x0+8}" y="${yb-30}" width="${w-16}" height="34" fill="#8fbcd6"/>${salt}${vap}<path d="M${x0} ${yt} L${x1} ${yt+60}" stroke="#d6f0ff" stroke-width="8" opacity=".7"/>${dr}<path d="M${x1} ${yt+64} V${yt+110} H${x1+40}" stroke="var(--dark)" stroke-width="6" fill="none"/><rect x="${x1+30}" y="${yt+100}" width="50" height="80" rx="6" fill="#fffaf0" stroke="var(--dark)" stroke-width="3"/><rect x="${x1+34}" y="${yt+176-72*fill}" width="42" height="${72*fill}" fill="var(--water)"/>${T(x1+55,yt+200,'água doce',16,'middle','#fff')}${T(400,yb+60,'água salobra',18,'middle','#fff')}`},
q:{p:'No dessalinizador solar, a água salobra evapora com o calor do sol, o vapor condensa no vidro e escorre para um coletor, enquanto o sal fica na caixa. Esse processo de separação é a',o:['filtração','decantação','destilação','centrifugação','catação'],a:2,e:'Evaporação seguida de condensação é a destilação. O sal não evapora e fica para trás.'}},

{id:'lenha-ou-gas',d:'Química',t:'Lenha, carvão, gás ou biogás?',enem:'Termoquímica: poder calorífico e rendimento',
ctx:'Para cozinhar um panelão de feijão, quanto de cada combustível vai embora? E quanto calor se perde no caminho?',
con:'Cada combustível libera uma quantidade de energia por quilo na queima: o <b>poder calorífico</b>. Mas o fogão não aproveita tudo: o fogão de lenha aberto perde cerca de 85% do calor, e um bom fogão a gás perde perto da metade. <b>Massa necessária = energia útil ÷ (poder calorífico × rendimento)</b>. Valores aproximados.',
c:[{id:'f',l:'Combustível',opts:[[0,'Lenha'],[1,'Carvão'],[2,'Gás de botijão'],[3,'Biogás']],v:0},{id:'m',l:'Feijão com água na panela',min:1,max:20,s:1,v:6,u:'kg'}],
run:v=>{const F=FUEL[v.f],E=v.m*4186*75+v.m*.4e6,q=E/(F.pci*1e6*F.ef),co2=q*F.co2;return{F,q,big:br(q,q<1?2:1)+' '+F.u,bl:F.n+' para cozinhar o feijão',st:F.ef<.2?['bad','Fogão de lenha aberto: 85% do calor se perde e a fumaça faz mal']:F.ef<.4?['warn','Aproveita só um quarto do calor']:['ok','Aproveita mais da metade do calor'],m:[['Energia na panela',br(E/1e6,1)+' MJ'],['Poder calorífico',F.pci+' MJ/'+F.u],['Calor perdido',Math.round((1-F.ef)*100)+'%'],['CO₂ liberado',br(co2,2)+' kg']],fx:`m = ${br(E/1e6,2)} MJ ÷ (${F.pci} MJ/${F.u} · ${br(F.ef,2)}) ≈ ${br(q,2)} ${F.u}`}},
draw:(v,r,t)=>{const F=r.F,cx=400,py=170,i=v.f;let fire='';if(i<2){for(let k=0;k<3;k++){const h=40+20*Math.sin(t*9+k*2);fire+=`<path d="M${cx-40+k*40} 300 q-16 -${h*.5} 0 -${h} q16 ${h*.5} 0 ${h}z" fill="${k%2?'var(--gold)':'var(--red)'}"/>`}fire+=i===0?`<rect x="${cx-90}" y="300" width="180" height="16" rx="8" fill="#7a4a21" transform="rotate(8 ${cx} 308)"/><rect x="${cx-90}" y="300" width="180" height="16" rx="8" fill="#6b4a2a" transform="rotate(-8 ${cx} 308)"/>`:Array.from({length:9},(_,k)=>`<circle cx="${cx-60+k*15}" cy="${306+(k%2)*6}" r="9" fill="${Math.sin(t*4+k)>0?'#e5541b':'#3a2d22'}"/>`).join('')}else{for(let k=0;k<10;k++){const a=k/10*Math.PI*2,h=18+4*Math.sin(t*12+k);fire+=`<path d="M${(cx+Math.cos(a)*50).toFixed(1)} 296 q-5 -${h/2} 0 -${h} q5 ${h/2} 0 ${h}z" fill="${i===3?'#4fa3e0':'#3b6fd8'}"/>`}fire+=`<ellipse cx="${cx}" cy="300" rx="60" ry="8" fill="#555"/>`}let loss='';for(let k=0;k<Math.round((1-F.ef)*12);k++){const p=PH(t,1.6,k/12),s=k%2?1:-1;loss+=`<path d="M${(cx+s*(70+p*200)).toFixed(1)} ${260-k*4} q${s*10} -8 ${s*20} 0 q${s*10} 8 ${s*20} 0" stroke="var(--red)" stroke-width="3" fill="none" opacity="${(1-p).toFixed(2)}"/>`}let sm='';if(i<2)for(let k=0;k<6;k++){const p=PH(t,3,k/6);sm+=`<circle cx="${(cx-60+k*24+Math.sin(t+k)*10).toFixed(1)}" cy="${(140-p*120).toFixed(1)}" r="${10+p*20}" fill="#6b6b6b" opacity="${(.5*(1-p)).toFixed(2)}"/>`}let st='';for(let k=0;k<3;k++){const p=PH(t,2,k/3);st+=`<path d="M${cx-20+k*20} ${(py-10-p*50).toFixed(1)} q8 -10 0 -20" stroke="#fff" stroke-width="3" fill="none" opacity="${(1-p).toFixed(2)}"/>`}const pile=Math.min(10,Math.ceil(r.q*(i<2?1:4)));
return sky+`<rect y="320" width="800" height="100" fill="var(--ground2)"/>`+sm+loss+fire+`<path d="M${cx-80} ${py} h160 v80 q0 30 -30 30 h-100 q-30 0 -30 -30z" fill="#3a3a3a" stroke="var(--dark)" stroke-width="4"/>${st}${T(cx,py+50,'feijão',20,'middle','#fff')}`+Array.from({length:pile},(_,k)=>i===0?`<rect x="${600+(k%3)*40}" y="${370-Math.floor(k/3)*16}" width="36" height="12" rx="6" fill="#7a4a21"/>`:i===1?`<circle cx="${610+(k%4)*24}" cy="${380-Math.floor(k/4)*18}" r="10" fill="#16100c"/>`:i===2?`<rect x="${600+(k%4)*36}" y="${340-Math.floor(k/4)*60}" width="30" height="50" rx="10" fill="var(--red)"/>`:`<ellipse cx="${640}" cy="${370-k*6}" rx="${40-k*2}" ry="8" fill="var(--gold)"/>`).join('')+T(660,300,br(r.q,1)+' '+F.u,24,'middle','var(--ink)')},
q:{p:'O poder calorífico do gás de cozinha (GLP) é de cerca de 46 MJ/kg. Se o fogão aproveita 50% do calor, a massa de gás necessária para fornecer 2,3 MJ à panela é de',o:['25 g','50 g','100 g','200 g','460 g'],a:2,e:'Como só metade do calor é aproveitada, a queima precisa liberar 4,6 MJ. 4,6 ÷ 46 = 0,1 kg = 100 g.'}},

{id:'repolho-roxo',d:'Química',t:'Repolho roxo: o detetive do pH',enem:'Indicadores ácido-base',
ctx:'O suco de repolho roxo muda de cor conforme o que você mistura nele. Teste o limão, o vinagre, o bicarbonato e a água de cal, e veja a cor mudar quando você dilui.',
con:'O repolho roxo tem pigmentos (antocianinas) que mudam de cor com o pH: vermelho nos <b>ácidos</b>, roxo no <b>neutro</b>, azul e verde nas <b>bases</b>. Ele é um <b>indicador ácido-base</b>. pH = −log[H⁺]: diluir 10 vezes um ácido aproxima seu pH de 7 em uma unidade.',
c:[{id:'s',l:'O que misturar',opts:[[2,'Limão'],[3,'Vinagre'],[6.5,'Leite'],[7,'Água da cisterna'],[8.3,'Bicarbonato'],[10,'Sabão em barra'],[12.4,'Água de cal']],v:2},{id:'dil',l:'Diluir em água',min:1,max:100,s:1,v:1,u:'×'}],
run:v=>{const lg=Math.log10(v.dil),p=v.s<7?Math.min(7,v.s+lg):Math.max(7,v.s-lg),tp=p<6.5?'Ácido':p<=7.5?'Neutro':'Básico',nm=SIMS.find(x=>x.id==='repolho-roxo').c[0].opts.find(o=>o[0]==v.s)[1];return{p,nm,big:'pH '+br(p,1),bl:nm+(v.dil>1?` diluído ${Math.round(v.dil)}×`:''),st:[p<6.5?'bad':p<=7.5?'ok':'warn',tp+(p<6.5?': repolho fica vermelho':p<=7.5?': repolho fica roxo':': repolho fica azul ou verde')],m:[['Tipo',tp],['[H⁺]',`10<sup>−${br(p,1)}</sup> mol/L`],['Diluição',Math.round(v.dil)+' ×'],['pH sem diluir',br(v.s,1)]],fx:`pH = −log[H⁺] · diluir ${Math.round(v.dil)}× muda o pH em ${br(lg,1)}`}},
draw:(v,r,t)=>{const col=phCor(r.p);let sw='';for(let i=0;i<8;i++){const a=t*2+i;sw+=`<circle cx="${(400+Math.cos(a)*40*(i%3+1)/3).toFixed(1)}" cy="${(290+Math.sin(a*1.3)*50).toFixed(1)}" r="4" fill="#fff" opacity=".35"/>`}const p=PH(t,1.6),dy=60+p*120;let bar='';for(let i=1;i<=14;i++)bar+=`<rect x="${70+(i-1)*47}" y="20" width="47" height="26" fill="${phCor(i)}"/>${T(93+(i-1)*47,66,i,15,'middle','var(--soft)',400)}`;
return `<rect width="800" height="420" fill="var(--card)"/>`+bar+`<path d="M${70+(r.p-1)*47} 48 l-10 14 h20z" fill="var(--dark)"/><path d="M330 100 v250 a70 50 0 0 0 140 0 v-250" fill="#f7f3ea" stroke="var(--dark)" stroke-width="5"/><path d="M334 170 v180 a66 46 0 0 0 132 0 v-180z" fill="${col}"/>${sw}<circle cx="400" cy="${dy.toFixed(1)}" r="9" fill="#6a3fa0" opacity="${(1-p).toFixed(2)}"/><path d="M380 70 h40 v-30 h-40z" fill="#6a3fa0" stroke="var(--dark)" stroke-width="3"/>${T(400,30+0,'',1)}${T(610,220,r.nm,26,'middle','var(--ink)')}${T(610,260,'pH '+br(r.p,1),34,'middle','var(--redt)')}<ellipse cx="160" cy="300" rx="70" ry="60" fill="#6a3fa0" stroke="var(--dark)" stroke-width="4"/><path d="M110 280 q50 -40 100 0 M120 320 q40 -30 80 0" stroke="#9c6fd0" stroke-width="5" fill="none"/>${T(160,390,'repolho roxo',18,'middle','var(--soft)')}`},
q:{p:'O suco de repolho roxo fica vermelho em contato com o limão e verde em contato com a água de cal. Isso acontece porque esse suco funciona como um',o:['catalisador','indicador ácido-base','solvente apolar','metal alcalino','sal neutro'],a:1,e:'Seus pigmentos mudam de cor conforme o pH: vermelho em meio ácido, roxo no neutro, azul e verde em meio básico.'}},

{id:'piramide-energia',d:'Biologia',t:'A energia na cadeia da caatinga',enem:'Ecologia: fluxo de energia e pirâmides',
ctx:'O capim guarda a energia do sol. O preá come o capim, o gato-do-mato come o preá e o carcará come o gato. Quanto da energia chega lá em cima?',
con:'A cada passo da cadeia alimentar, só uma pequena parte da energia passa para o nível seguinte, em média <b>10%</b>. O resto é gasto na respiração, no movimento e sai como calor. Por isso a pirâmide de energia afina para cima e há bem menos predadores do que presas. <b>E<sub>n+1</sub> = E<sub>n</sub> · eficiência</b>.',
c:[{id:'P',l:'Energia guardada pelo capim',min:2000,max:20000,s:1000,v:10000,u:'kJ'},{id:'e',l:'Eficiência entre níveis',min:5,max:20,s:1,v:10,u:'%'}],
run:v=>{const e=v.e/100,L=[v.P,v.P*e,v.P*e*e,v.P*e**3];return{L,big:br(L[3],L[3]<10?1:0)+' kJ',bl:'Energia que chega ao carcará',st:['warn',`Só ${br(e**3*100,e**3*100<1?2:1)}% da energia do capim chega ao topo`],m:[['Preá',br(L[1],0)+' kJ'],['Gato-do-mato',br(L[2],1)+' kJ'],['Carcará',br(L[3],2)+' kJ'],['Perdida como calor',br((v.P-L[3])/v.P*100,1)+'%']],fx:`E₄ = E₁ · e³ = ${br(v.P,0)} · ${br(e,2)}³ ≈ ${br(L[3],2)} kJ`}},
draw:(v,r,t)=>{const nm=['capim','preá','gato-do-mato','carcará'],cols=['var(--leaf)','var(--clay)','var(--gold)','var(--red)'],mx=Math.pow(r.L[0],.3);let s='';r.L.forEach((E,i)=>{const w=Math.max(40,560*Math.pow(E,.3)/mx),y=330-i*80;s+=`<rect x="${400-w/2}" y="${y}" width="${w}" height="66" rx="6" fill="${cols[i]}" stroke="var(--dark)" stroke-width="3"/>${T(400,y+28,nm[i],20,'middle','#fff')}${T(400,y+54,br(E,E<10?1:0)+' kJ',18,'middle','#fff',400)}`});let dots='',heat='';for(let i=0;i<24;i++){const p=PH(t,3,i/24),lv=Math.floor(p*4),alive=Math.random,keep=(i%Math.round(100/v.e))===0||lv===0;if(lv>0&&(i*7)%10>=Math.round(v.e/10*3)&&lv>1)continue;dots+=`<circle cx="${(400+Math.sin(i*2.1)*40).toFixed(1)}" cy="${(390-p*320).toFixed(1)}" r="5" fill="#ffe66d" stroke="var(--dark)" stroke-width="1" opacity="${(1-p*.6).toFixed(2)}"/>`}for(let i=0;i<10;i++){const p=PH(t,2,i/10),s2=i%2?1:-1,y=360-(i%4)*80;heat+=`<path d="M${(400+s2*(120-((i%4)*30)+p*140)).toFixed(1)} ${y} q${s2*8} -10 ${s2*16} 0 q${s2*8} 10 ${s2*16} 0" stroke="var(--red)" stroke-width="3" fill="none" opacity="${(1-p).toFixed(2)}"/>`}
return sky+SUN(90,50,24,t)+s+heat+dots+T(700,60,'calor perdido',18,'middle','var(--redt)')},
q:{p:'Numa cadeia alimentar da caatinga, o capim guarda 10 000 kJ de energia. Se só 10% passa de um nível para o seguinte, a energia que chega ao terceiro nível (o predador que come o preá) é de',o:['10 kJ','100 kJ','1 000 kJ','3 000 kJ','9 000 kJ'],a:1,e:'Capim 10 000 → preá 1 000 → predador 100 kJ. Cada passo fica com 10% do anterior.'}},

{id:'resistencia',d:'Biologia',t:'A lagarta que o veneno não mata mais',enem:'Evolução: seleção natural',
ctx:'No começo, o veneno mata quase todas as lagartas do milho. Safra após safra, ele vai perdendo o efeito. O que está acontecendo?',
con:'Algumas poucas lagartas já nascem <b>resistentes</b>, por uma diferença genética. O veneno mata as sensíveis e deixa as resistentes vivas. Elas se reproduzem e passam a resistência aos filhos. Isso é <b>seleção natural</b>. Deixar uma área sem veneno (<b>refúgio</b>) mantém lagartas sensíveis e atrasa a resistência.',
c:[{id:'ap',l:'Aplicações por safra',min:0,max:6,s:1,v:3,u:''},{id:'rf',l:'Área de refúgio sem veneno',min:0,max:50,s:5,v:0,u:'%'},{id:'r0',l:'Resistentes no começo',min:.1,max:10,s:.1,v:1,u:'%'}],
run:v=>{const S=v.rf/100+(1-v.rf/100)*Math.pow(.1,v.ap/3);let r=v.r0/100;const a=[r];let g50=null;for(let g=1;g<=12;g++){r=r*.95/(r*.95+(1-r)*S);a.push(r);if(g50===null&&r>=.5)g50=g}const rf=a[12]*100;return{a,S,big:Math.round(rf)+'%',bl:'Lagartas resistentes após 12 safras',st:rf<20?['ok','O veneno ainda funciona']:rf<60?['warn','A resistência está crescendo']:['bad','O veneno perdeu o efeito'],m:[['Passou de 50% na safra',g50??'não passou'],['Sensíveis que sobrevivem',br(S*100,1)+'%'],['Resistentes no começo',br(v.r0,1)+'%'],['Refúgio',Math.round(v.rf)+'%']],fx:`r' = r·0,95 / (r·0,95 + (1 − r)·${br(S,3)})`}},
draw:(v,r,t,k)=>{const x0=90,x1=760,y0=230,y1=40,X=g=>x0+(x1-x0)*g/12,Y=p=>y0-(y0-y1)*p,g=Math.min(12,PH(t,9)*14),gi=Math.floor(Math.min(g,12)),f=Math.min(g,12)-gi,cur=r.a[gi]+(r.a[Math.min(12,gi+1)]-r.a[gi])*f;let pts='';for(let i=0;i<=gi;i++)pts+=`${X(i)},${Y(r.a[i])} `;pts+=`${X(Math.min(g,12))},${Y(cur)}`;let tk='';for(let i=0;i<=12;i+=3)tk+=T(X(i),y0+24,i,16,'middle','var(--soft)',400);let lag='';for(let i=0;i<20;i++){const res=i/20<cur,x=70+(i%10)*70,y=310+Math.floor(i/10)*50,wg=Math.sin(t*5+i)*4;lag+=`<path d="M${x} ${y} q8 ${-6+wg} 16 0 q8 ${6-wg} 16 0 q8 ${-6+wg} 16 0" stroke="${res?'var(--red)':'var(--leaf)'}" stroke-width="12" fill="none" stroke-linecap="round"/><circle cx="${x+48}" cy="${y}" r="7" fill="var(--dark)"/>`}
return `<rect width="800" height="420" fill="var(--card)"/><path d="M${x0} ${y1} V${y0} H${x1}" stroke="var(--dark)" stroke-width="2" fill="none"/>${tk}${T(x1,y0+24,'safras',16,'end','var(--soft)',400)}${T(x0-8,y1+6,'100%',16,'end','var(--soft)',400)}${T(x0-8,y0,'0%',16,'end','var(--soft)',400)}<polyline points="${pts}" fill="none" stroke="var(--red)" stroke-width="5"/><circle cx="${X(Math.min(g,12))}" cy="${Y(cur)}" r="9" fill="var(--red)" stroke="#fffaf0" stroke-width="3"/>${T(Math.min(X(g)+14,x1-200),Math.max(y1+20,Y(cur)-12),'safra '+Math.round(Math.min(g,12))+': '+Math.round(cur*100)+'% resistentes',18,'start','var(--ink)')}`+lag+`<circle cx="540" cy="404" r="7" fill="var(--red)"/>${T(554,410,'resistente',16,'start','var(--ink)',400)}<circle cx="660" cy="404" r="7" fill="var(--leaf)"/>${T(674,410,'sensível',16,'start','var(--ink)',400)}`},
q:{p:'O uso repetido do mesmo inseticida faz surgir populações de pragas resistentes porque',o:['o veneno provoca, em cada lagarta, a mutação que dá resistência','os insetos se acostumam ao veneno e passam esse costume aos filhos','o veneno seleciona os indivíduos que já eram resistentes, que sobrevivem e se reproduzem','insetos resistentes migram de outras regiões','o veneno perde a força com o tempo'],a:2,e:'É seleção natural: a resistência já existia em poucos indivíduos. O veneno elimina os sensíveis e os resistentes deixam mais descendentes.'}},

{id:'dengue',d:'Biologia',t:'Mosquito da dengue no quintal',enem:'Saúde e ambiente: ciclo do Aedes aegypti',
ctx:'Pneu velho, vaso, lata e a cisterna destampada juntam água parada. Veja como o número de mosquitos cresce em 8 semanas e o que ajuda a controlar.',
con:'O <b>Aedes aegypti</b> transmite dengue, zika e chikungunya. A fêmea põe ovos em <b>água parada</b>, e em cerca de 7 a 10 dias as larvas viram mosquitos. Tampar a cisterna e eliminar os recipientes uma vez por semana quebra o ciclo antes de o mosquito nascer. Modelo ilustrativo.',
c:[{id:'rc',l:'Recipientes com água parada',min:0,max:30,s:1,v:8,u:''},{id:'tp',l:'Cisterna',opts:[[0,'Destampada'],[1,'Tampada']],v:0},{id:'lp',l:'Faxina semanal no quintal',opts:[[0,'Não'],[1,'Sim']],v:0}],
run:v=>{const B=v.rc+(v.tp?0:10),Be=B*(v.lp?.12:1);let M=5;const a=[M];for(let w=1;w<=8;w++){M=M*.5+Be*6;a.push(M)}return{a,M,B,Be,big:br(M,0)+' mosquitos',bl:'No quintal depois de 8 semanas',st:M<20?['ok','Ciclo quebrado: risco baixo']:M<80?['warn','Risco médio de dengue']:['bad','Risco alto de dengue na casa'],m:[['Criadouros',B],['Criadouros ativos',br(Be,1)],['Ovo até mosquito','7 a 10 dias'],['Cisterna',v.tp?'tampada':'destampada']],fx:`mosquitos na semana seguinte = metade dos atuais + criadouros ativos × 6`}},

{id:'galinha-andaluza',d:'Biologia',t:'A galinha azul do terreiro',enem:'Genética: herança sem dominância',
ctx:'Na galinha andaluza, cruzar uma ave preta com uma branca dá pintinhos azulados. Escolha o galo e a galinha e veja os pintinhos nascerem.',
con:'Aqui nenhum alelo domina o outro: é <b>herança sem dominância</b> (dominância incompleta). <b>BB</b> é preta, <b>WW</b> é branca e <b>BW</b> é azulada, uma mistura das duas. Por isso o cruzamento de duas azuladas dá <b>1 preta : 2 azuladas : 1 branca</b>, e a cor revela o genótipo.',
c:[{id:'go',l:'Galo',opts:[[0,'BB · preto'],[1,'BW · azulado'],[2,'WW · branco']],v:1},{id:'ga',l:'Galinha',opts:[[0,'BB · preta'],[1,'BW · azulada'],[2,'WW · branca']],v:1},{id:'n',l:'Pintinhos',min:4,max:100,s:4,v:24,u:''}],
act:'Chocar de novo',
run:v=>{const a=AGM[v.go],b=AGM[v.ga],R=rng(v.seed+31);let c={BB:0,BW:0,WW:0};const cv=[];for(let i=0;i<v.n;i++){const x=a[R()<.5?0:1],y=b[R()<.5?0:1],g=x===y?x+y:'BW';c[g]++;cv.push(g)}let e={BB:0,BW:0,WW:0};a.forEach(x=>b.forEach(y=>{e[x===y?x+y:'BW']+=25}));const n=cv.length||1;return{cv,big:Math.round(c.BW/n*100)+'% azulados',bl:`${c.BB} pretos · ${c.BW} azulados · ${c.WW} brancos`,st:['ok',`Esperado: ${e.BB}% pretos · ${e.BW}% azulados · ${e.WW}% brancos`],m:[['Pretos (BB)',c.BB],['Azulados (BW)',c.BW],['Brancos (WW)',c.WW],['Esperado azulados',e.BW+'%']],fx:`${AGT[v.go]} × ${AGT[v.ga]} → ${e.BB}% BB : ${e.BW}% BW : ${e.WW}% WW`}},
draw:(v,r,t,k)=>{const a=AGM[v.go],b=AGM[v.ga],cc={BB:'#16100c',BW:'#5c7fa6',WW:'#fffaf0'};let p=T(160,50,'galo',20,'middle')+T(40,175,'galinha',18,'middle');a.forEach((x,i)=>p+=T(120+i*90,85,x,28,'middle','var(--redt)'));b.forEach((y,j)=>{p+=T(80,150+j*90,y,28,'middle','var(--goldt)');a.forEach((x,i)=>{const g=x===y?x+y:'BW';p+=`<rect x="${78+i*90}" y="${100+j*90}" width="84" height="84" rx="8" fill="${cc[g]}" stroke="var(--dark)" stroke-width="2"/>`+T(120+i*90,152+j*90,g,26,'middle',g==='WW'?'#16100c':'#fff')})});let c='';const cols=10,sz=Math.min(34,300/Math.ceil(r.cv.length/cols));r.cv.forEach((g,i)=>{const s=cl((k-i*.03)*5,0,1);if(!s)return;const x=330+(i%cols)*44,y=70+Math.floor(i/cols)*(sz+6)+Math.abs(Math.sin(t*5+i))*-3,R=sz/2.4*s;c+=`<circle cx="${x}" cy="${y.toFixed(1)}" r="${R.toFixed(1)}" fill="${cc[g]}" stroke="var(--dark)" stroke-width="2"/><path d="M${x+R*.8} ${y.toFixed(1)} l${R*.5} 2 l${-R*.5} 3z" fill="var(--gold)"/><circle cx="${x+R*.3}" cy="${(y-R*.3).toFixed(1)}" r="1.8" fill="${g==='BB'?'#fff':'#16100c'}"/>`});
return `<rect width="800" height="420" fill="var(--card)"/>`+p+c},
q:{p:'Em galinhas andaluzas, o cruzamento de aves pretas com aves brancas produz filhotes azulados (herança sem dominância). Do cruzamento de duas aves azuladas, a proporção esperada de filhotes é',o:['100% azulados','3 pretos : 1 branco','1 preto : 2 azulados : 1 branco','1 preto : 1 branco','9 : 3 : 3 : 1'],a:2,e:'BW × BW gera 1 BB : 2 BW : 1 WW. Como não há dominância, cada genótipo tem sua cor: preto, azulado e branco.'}},

{id:'compostagem',d:'Biologia',t:'Compostagem: lixo que vira adubo',enem:'Decompositores e ciclos da matéria',

);

{id:'ondas-no-acude',d:'Física',t:'Ondas na água do açude',enem:'Ondulatória: v = λ·f',

con:'Toda onda obedece à <b>equação fundamental</b>: <b>v = λ·f</b>. A frequência (f) é quantas ondas saem por segundo e depende de quem bate. A velocidade (v) depende do meio: em água rasa, <b>v ≈ √(g·h)</b>. Com a velocidade fixa, bater mais rápido deixa as ondas mais curtas.',

{id:'radio-do-sitio',d:'Física',t:'O rádio do sítio e as ondas no ar',enem:'Ondas eletromagnéticas: c = λ·f',

{id:'viola',d:'Física',t:'A corda da viola',enem:'Ondas estacionárias em cordas',
ctx:'O violeiro aperta a tarraxa e o som fica mais agudo. Encurta a corda com o dedo e também. Descubra a física por trás das notas.',

c:[{id:'L',l:'Comprimento da corda',min:.3,max:.9,s:.01,v:.65,u:'m'},{id:'T',l:'Tensão',min:30,max:150,s:5,v:80,u:'N'},{id:'n',l:'Harmônico',min:1,max:5,s:1,v:1,u:''}],
run:v=>{const s=Math.sqrt(v.T/.0008),f=v.n*s/(2*v.L);return{s,f,big:br(f,0)+' Hz',bl:`Frequência do ${Math.round(v.n)}º harmônico`,st:['ok',`Mais perto da nota ${nota(f)}`],m:[['Velocidade na corda',br(s,0)+' m/s'],['Comprimento de onda',br(2*v.L/v.n,2)+' m'],['Fundamental',br(s/(2*v.L),0)+' Hz'],['Ventres (barrigas)',Math.round(v.n)]],fx:`f = n·v / 2L = ${Math.round(v.n)} · ${br(s,0)} / (2 · ${br(v.L,2)}) ≈ ${br(f,0)} Hz`}},
draw:(v,r,t)=>{const x0=90,x1=x0+v.L*800,yc=210,n=Math.round(v.n),A=40/Math.sqrt(n)*Math.cos(t*Math.min(30,r.f/20));let pts='',env='';for(let x=x0;x<=x1;x+=3){const u=(x-x0)/(x1-x0);pts+=`${x},${(yc-A*Math.sin(n*Math.PI*u)).toFixed(1)} `}for(let x=x0;x<=x1;x+=3){const u=(x-x0)/(x1-x0);env+=`${x},${(yc-40/Math.sqrt(n)*Math.sin(n*Math.PI*u)).toFixed(1)} `}let nodes='';for(let k=0;k<=n;k++)nodes+=`<circle cx="${x0+(x1-x0)*k/n}" cy="${yc}" r="7" fill="var(--red)"/>`;
return `<rect width="800" height="420" fill="var(--card)"/><rect x="40" y="${yc-70}" width="${x1-40+40}" height="140" rx="20" fill="#c98b4a" stroke="var(--dark)" stroke-width="3"/>${Array.from({length:8},(_,i)=>`<path d="M${x0+(x1-x0)*(i+1)/9} ${yc-70} v140" stroke="#e9dcc4" stroke-width="3"/>`).join('')}<rect x="${x1}" y="${yc-90}" width="110" height="180" rx="40" fill="#7a4a21" stroke="var(--dark)" stroke-width="3"/><circle cx="${x1+55}" cy="${yc}" r="30" fill="#3a2d22"/><rect x="20" y="${yc-50}" width="40" height="100" rx="8" fill="#3a2d22"/><circle cx="40" cy="${yc-30}" r="8" fill="var(--gold)" transform="rotate(${(v.T*3)%360} 40 ${yc-30})"/><polyline points="${env}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 5"/><polyline points="${pts}" fill="none" stroke="var(--dark)" stroke-width="4"/>${nodes}${T(400,330,br(r.f,0)+' Hz · nota '+nota(r.f),30,'middle','var(--redt)')}${T(400,390,'● nós   - - envoltória   L = '+br(v.L,2)+' m',18,'middle','var(--soft)',400)}`},
q:{p:'Uma corda de viola tem 0,5 m de comprimento entre os apoios, e as ondas nela se propagam a 200 m/s. A frequência fundamental dessa corda é',o:['100 Hz','200 Hz','400 Hz','800 Hz','1 000 Hz'],a:1,e:'No modo fundamental λ = 2L = 1 m, e f = v/λ = 200/1 = 200 Hz.'}},

{id:'eco-na-serra',d:'Física',t:'O eco na serra',enem:'Ondas sonoras: reflexão e eco',
ctx:'Grite de frente para a serra ou para a parede do açude e a voz volta. Quanto tempo o som leva para voltar? E quando ele vira só um reforço da voz?',
con:'O som <b>reflete</b> em superfícies grandes e duras. Ele vai e volta, então percorre o dobro da distância: <b>2d = v·t</b>. O ouvido só separa dois sons com pelo menos <b>0,1 s</b> de diferença. Por isso só há <b>eco</b> se o obstáculo estiver a mais de uns 17 m. Mais perto, ouvimos um prolongamento do som, a <b>reverberação</b>.',
c:[{id:'d',l:'Distância até a serra',min:5,max:600,s:5,v:170,u:'m'},{id:'T',l:'Temperatura do ar',min:10,max:40,s:1,v:30,u:'°C'}],
run:v=>{const s=331+.6*v.T,tm=2*v.d/s;return{s,tm,big:br(tm,2)+' s',bl:'Tempo até o eco voltar',st:tm>=.1?['ok','Dá para ouvir o eco separado da voz']:['warn','Volta rápido demais: vira reverberação'],m:[['Velocidade do som',br(s,0)+' m/s'],['Caminho total',br(2*v.d,0)+' m'],['Distância mínima p/ eco',br(s*.05,1)+' m'],['Ida',br(tm/2,2)+' s']],fx:`t = 2d / v = 2 · ${v.d} / ${br(s,0)} ≈ ${br(tm,2)} s`}},
draw:(v,r,t)=>{const G=330,px=110,sx=cl(150+v.d*1.05,190,700),cyc=Math.max(1.2,r.tm*1.6),tt=PH(t,cyc)*cyc,u=Math.min(1,tt/r.tm),go=u<.5,x=go?px+(sx-px)*u*2:sx-(sx-px)*(u-.5)*2,arc=go?'M':'';const shout=tt<.25,back=u>=1&&tt<r.tm+.5;
return sky+`<path d="M${sx} ${G} L${sx+20} 90 L${sx+90} 60 L800 110 V${G}z" fill="#8a6a4a" stroke="var(--dark)" stroke-width="3"/>`+ground(G)+(u<1?`<path d="M${x.toFixed(1)} ${G-130} a40 40 0 0 ${go?1:0} 0 80" stroke="${go?'var(--red)':'var(--gold)'}" stroke-width="5" fill="none" transform="${go?'':`scale(-1 1) translate(${-2*x} 0)`}"/><path d="M${(x+(go?-14:14)).toFixed(1)} ${G-120} a28 28 0 0 ${go?1:0} 0 60" stroke="${go?'var(--red)':'var(--gold)'}" stroke-width="3" fill="none" opacity=".6" transform="${go?'':`scale(-1 1) translate(${-2*(x+14)} 0)`}"/>`:'')+`<g transform="translate(${px} ${G})"><circle cy="-80" r="13" fill="var(--red)" stroke="var(--dark)" stroke-width="2"/><path d="M0 -67 V-30 M0 -30 l-10 30 M0 -30 l10 30 M0 -55 l-14 14 M0 -55 l16 -6" stroke="var(--dark)" stroke-width="5" stroke-linecap="round"/>${shout?'<path d="M14 -84 h10 M14 -78 l9 4" stroke="var(--dark)" stroke-width="3"/>':''}</g>${shout?T(px+20,G-110,'ÔÔÔ!',26,'start','var(--redt)'):''}${back?T(px+30,G-140,'...ôô!',24,'start','var(--goldt)'):''}<g stroke="#fff" stroke-width="3"><path d="M${px} ${G+40} H${sx}"/><path d="M${px} ${G+30} v20 M${sx} ${G+30} v20"/></g>${T((px+sx)/2,G+75,'d = '+v.d+' m',22,'middle','#fff')}${T(400,40,'t = '+br(Math.min(tt,r.tm),2)+' s',28,'middle','var(--ink)')}`},
q:{p:'Um vaqueiro grita em frente a um paredão de pedra e ouve o eco 2 segundos depois. Sendo a velocidade do som igual a 340 m/s, a distância até o paredão é de',o:['170 m','340 m','680 m','1 020 m','1 360 m'],a:1,e:'O som vai e volta: 2d = v·t = 340·2 = 680 m, então d = 340 m.'}},

{id:'doppler',d:'Física',t:'O carro de som da feira',enem:'Efeito Doppler',
ctx:'Quando o carro de som anunciando a feira passa pela estrada, a voz fica mais aguda chegando e mais grave indo embora. A buzina não mudou: quem mudou foi o que você ouve.',
con:'Quando a fonte se aproxima, as ondas chegam “espremidas”: o ouvinte recebe mais ondas por segundo e o som fica mais <b>agudo</b>. Quando se afasta, as ondas chegam esticadas e o som fica mais <b>grave</b>. É o <b>efeito Doppler</b>: <b>f = f₀ · v / (v ∓ v<sub>fonte</sub>)</b>. O mesmo efeito mede a velocidade de carros no radar.',
c:[{id:'vs',l:'Velocidade do carro',min:0,max:120,s:5,v:60,u:'km/h'},{id:'f0',l:'Som da buzina',min:200,max:1000,s:10,v:500,u:'Hz'}],
run:v=>{const s=v.vs/3.6,a=v.f0*340/(340-s),b=v.f0*340/(340+s);return{s,a,b,big:br(a,0)+' Hz',bl:'O que você ouve com o carro chegando',st:['ok',`Indo embora: ${br(b,0)} Hz, mais grave`],m:[['Som real da buzina',br(v.f0,0)+' Hz'],['Chegando',br(a,0)+' Hz'],['Indo embora',br(b,0)+' Hz'],['Velocidade',br(s,1)+' m/s']],fx:`f = f₀·v/(v − v<sub>f</sub>) = ${v.f0} · 340 / (340 − ${br(s,1)}) ≈ ${br(a,0)} Hz`}},
draw:(v,r,t)=>{const G=300,cs=260,vc=Math.min(230,cs*r.s/340*3),cx=vc>0?-80+((t*vc)%960):250,lx=400;let rings='';for(let k=1;k<=9;k++){const age=k*.3-(t%.3),ox=cx-vc*age,R=cs*age;rings+=`<circle cx="${ox.toFixed(1)}" cy="${G-40}" r="${R.toFixed(1)}" fill="none" stroke="var(--gold)" stroke-width="3" opacity="${Math.max(0,1-age/2.8).toFixed(2)}"/>`}const ap=cx<lx,fh=v.vs>0?(ap?r.a:r.b):v.f0;
return sky+rings+`<rect y="${G}" width="800" height="120" fill="#4a4744"/><path d="M0 ${G+40} H800" stroke="#f3efe6" stroke-width="3" stroke-dasharray="24 18"/><rect y="${G+80}" width="800" height="40" fill="var(--ground2)"/><g transform="translate(${cx.toFixed(1)} ${G-6})"><rect x="-60" y="-50" width="90" height="44" rx="6" fill="var(--red)" stroke="var(--dark)" stroke-width="3"/><rect x="30" y="-36" width="34" height="30" rx="5" fill="var(--tank)" stroke="var(--dark)" stroke-width="3"/><path d="M-30 -50 l-10 -22 h24 z" fill="var(--gold)" stroke="var(--dark)" stroke-width="2"/><circle cx="-36" cy="-4" r="11" fill="var(--dark)"/><circle cx="42" cy="-4" r="11" fill="var(--dark)"/></g><g transform="translate(${lx} ${G+110})"><circle cy="-50" r="11" fill="var(--gold)" stroke="var(--dark)" stroke-width="2"/><path d="M0 -39 V-12 M0 -12 l-8 12 M0 -12 l8 12" stroke="var(--dark)" stroke-width="5" stroke-linecap="round"/></g>${T(400,90,'você ouve: '+br(fh,0)+' Hz',30,'middle',v.vs>0?(ap?'var(--redt)':'var(--goldt)'):'var(--ink)')}${T(400,122,v.vs>0?(ap?'chegando: mais agudo':'indo embora: mais grave'):'carro parado: som igual',20,'middle','var(--soft)')}`},
q:{p:'Um carro de som passa em alta velocidade por uma pessoa parada na estrada. Comparado ao som emitido, o som que a pessoa ouve',o:['é mais agudo quando o carro se aproxima e mais grave quando se afasta','é sempre mais agudo','é sempre mais grave','fica mais alto, mas com a mesma frequência','é mais grave quando o carro se aproxima e mais agudo quando se afasta'],a:0,e:'Efeito Doppler: na aproximação a frequência percebida aumenta (mais agudo); no afastamento diminui (mais grave).'}},

{id:'pifano',d:'Física',t:'Pífano e berrante: o som dos tubos',enem:'Ondas sonoras em tubos abertos e fechados',
ctx:'O pífano da banda cabaçal e o berrante do vaqueiro fazem som com o ar vibrando dentro de um tubo. Mude o tamanho e veja a nota mudar.',
con:'Dentro do tubo forma-se uma <b>onda estacionária</b> de ar. No <b>tubo aberto</b> nas duas pontas (como o pífano): <b>f = n·v / (2L)</b>, com n = 1, 2, 3... No <b>tubo fechado</b> numa ponta: <b>f = n·v / (4L)</b>, só com n ímpar. Tubo mais comprido, som mais grave.',
c:[{id:'L',l:'Comprimento do tubo',min:.15,max:1.2,s:.01,v:.4,u:'m'},{id:'tp',l:'Tubo',opts:[[2,'Aberto nas duas pontas (pífano)'],[4,'Fechado numa ponta']],v:2},{id:'k',l:'Harmônico',min:1,max:4,s:1,v:1,u:''}],
run:v=>{const k=Math.round(v.k),n=v.tp===2?k:2*k-1,f=n*340/(v.tp*v.L);return{n,f,big:br(f,0)+' Hz',bl:`Harmônico n = ${n}`,st:['ok',`Mais perto da nota ${nota(f)}`],m:[['Tipo',v.tp===2?'aberto':'fechado'],['Fundamental',br(340/(v.tp*v.L),0)+' Hz'],['Comprimento de onda',br(v.tp*v.L/n,2)+' m'],['Harmônicos possíveis',v.tp===2?'todos':'só os ímpares']],fx:`f = n·v / ${v.tp}L = ${n} · 340 / (${v.tp} · ${br(v.L,2)}) ≈ ${br(f,0)} Hz`}},
draw:(v,r,t)=>{const x0=60,x1=x0+v.L*600,yc=210,h=96,n=r.n,cl2=v.tp===4,w=Math.cos(t*10);const env=x=>{const u=(x-x0)/(x1-x0);return cl2?Math.cos(n*Math.PI*u/2):Math.cos(n*Math.PI*u)};let pts='',pts2='',dots='';for(let x=x0;x<=x1;x+=3){pts+=`${x},${(yc-40*env(x)).toFixed(1)} `;pts2+=`${x},${(yc+40*env(x)).toFixed(1)} `}for(let i=0;i<24;i++){const bx=x0+12+(x1-x0-24)*i/23,dx=10*env(bx)*w;for(const yy of[-30,0,30])dots+=`<circle cx="${(bx+dx).toFixed(1)}" cy="${yc+yy}" r="3.5" fill="var(--water)"/>`}let noteN='';const p=PH(t,1.2);for(let i=0;i<3;i++){const q=PH(t,1.5,i/3);noteN+=`<text x="${(x1+30+q*120).toFixed(1)}" y="${(yc-20-q*60).toFixed(1)}" font-size="28" fill="var(--red)" opacity="${(1-q).toFixed(2)}">♪</text>`}
return `<rect width="800" height="420" fill="var(--card)"/><rect x="${x0}" y="${yc-h/2}" width="${x1-x0}" height="${h}" fill="#e9c46a" opacity=".35" stroke="var(--dark)" stroke-width="4"/>${cl2?`<rect x="${x0-14}" y="${yc-h/2-4}" width="14" height="${h+8}" fill="var(--dark)"/>`:''}${dots}<polyline points="${pts}" fill="none" stroke="var(--red)" stroke-width="3" stroke-dasharray="6 5"/><polyline points="${pts2}" fill="none" stroke="var(--red)" stroke-width="3" stroke-dasharray="6 5"/>${noteN}${T(400,100,br(r.f,0)+' Hz · nota '+nota(r.f),30,'middle','var(--redt)')}${T((x0+x1)/2,yc+90,'L = '+br(v.L,2)+' m',22,'middle','var(--ink)')}${T(400,380,cl2?'fechado numa ponta: lá o ar não se mexe (nó)':'aberto nas pontas: lá o ar vibra mais (ventre)',18,'middle','var(--soft)',400)}`},
q:{p:'Um pífano funciona como um tubo aberto nas duas extremidades e tem 0,5 m de comprimento. Considerando a velocidade do som 340 m/s, sua frequência fundamental é',o:['170 Hz','340 Hz','680 Hz','85 Hz','1 360 Hz'],a:1,e:'Tubo aberto: f = v/(2L) = 340/(2·0,5) = 340 Hz.'}},

{id:'barulho-do-trator',d:'Física',t:'O barulho do trator e o ouvido',enem:'Intensidade sonora e decibéis',
ctx:'Trator, motosserra e roçadeira fazem um barulho que, com o tempo, prejudica a audição. Afaste-se, use protetor e veja quanto tempo dá para trabalhar sem risco.',
con:'O nível sonoro é medido em <b>decibéis</b>: <b>β = 10·log(I/I₀)</b>. A escala é logarítmica: <b>+10 dB = 10 vezes mais intensidade</b>. Ao dobrar a distância, o nível cai cerca de 6 dB. Pela norma de trabalho (NR-15), 85 dB podem ser suportados por 8 h por dia, e cada +5 dB corta esse tempo pela metade.',
c:[{id:'fo',l:'Máquina',opts:FONTES,v:100},{id:'r',l:'Distância da máquina',min:1,max:100,s:1,v:2,u:'m'},{id:'p',l:'Protetor auricular',opts:[[0,'Sem protetor'],[20,'Com protetor (−20 dB)']],v:0}],
run:v=>{const b=v.fo-20*Math.log10(v.r)-v.p,tm=8/Math.pow(2,(b-85)/5),nm=FONTES.find(x=>x[0]==v.fo)[1];return{b,tm,nm,big:br(b,0)+' dB',bl:'Som que chega ao seu ouvido',st:b<=85?['ok','Seguro para um dia inteiro de trabalho']:b<=95?['warn',`Use no máximo ${tm>=1?br(tm,1)+' h':br(tm*60,0)+' min'} por dia`]:['bad',`Perigoso: só ${tm>=1?br(tm,1)+' h':br(tm*60,0)+' min'} por dia`],m:[['Máquina (a 1 m)',v.fo+' dB'],['Tempo seguro por dia',tm>=8?'8 h ou mais':tm>=1?br(tm,1)+' h':br(tm*60,0)+' min'],['Intensidade vs 85 dB',br(Math.pow(10,(b-85)/10),b<85?2:1)+' ×'],['Protetor',v.p?'sim':'não']],fx:`β = ${v.fo} − 20·log(${v.r})${v.p?' − 20':''} ≈ ${br(b,0)} dB`}},
draw:(v,r,t)=>{const G=320,mx=130,px=cl(mx+60+Math.log10(v.r)*290,200,760),lvl=cl((r.b-40)/80,0,1);let rings='';for(let i=0;i<5;i++){const p=PH(t,1.5,i/5);rings+=`<circle cx="${mx}" cy="${G-40}" r="${(p*700).toFixed(1)}" fill="none" stroke="var(--red)" stroke-width="${(1+v.fo/40).toFixed(1)}" opacity="${((1-p)*.8).toFixed(2)}"/>`}const sh=Math.sin(t*40)*(v.fo>80?2:.5);const col=r.b<=85?'var(--leaf)':r.b<=95?'var(--gold)':'var(--red)';
return sky+rings+ground(G)+`<g transform="translate(${mx} ${(G+sh).toFixed(1)})"><rect x="-60" y="-70" width="90" height="46" rx="6" fill="var(--red)" stroke="var(--dark)" stroke-width="3"/><rect x="0" y="-110" width="44" height="44" fill="var(--tank)" stroke="var(--dark)" stroke-width="3"/><circle cx="-40" cy="-20" r="24" fill="var(--dark)"/><circle cx="34" cy="-14" r="15" fill="var(--dark)"/><rect x="-50" y="-96" width="8" height="28" fill="var(--dark)"/></g>${T(mx,G+40,r.nm,20,'middle','#fff')}<g transform="translate(${px} ${G})"><circle cy="-80" r="13" fill="var(--gold)" stroke="var(--dark)" stroke-width="2"/>${v.p?'<path d="M-15 -90 a15 15 0 0 1 30 0" stroke="var(--red)" stroke-width="5" fill="none"/><circle cx="-14" cy="-80" r="6" fill="var(--red)"/><circle cx="14" cy="-80" r="6" fill="var(--red)"/>':''}<path d="M0 -67 V-30 M0 -30 l-10 30 M0 -30 l10 30 M0 -55 l-14 14 M0 -55 l14 14" stroke="var(--dark)" stroke-width="5" stroke-linecap="round"/></g>${T(px,G+40,v.r+' m',20,'middle','#fff')}<rect x="560" y="30" width="200" height="30" rx="6" fill="var(--tank)" stroke="var(--dark)" stroke-width="2"/><rect x="562" y="32" width="${(196*lvl).toFixed(1)}" height="26" rx="5" fill="${col}"/><path d="M${562+196*(45/80)} 26 v38" stroke="var(--dark)" stroke-width="2"/>${T(562+196*(45/80),86,'85 dB',14,'middle','var(--soft)',400)}${T(540,52,br(r.b,0)+' dB',22,'end','var(--ink)')}`},
q:{p:'Um trator produz 100 dB e uma conversa, 70 dB. A intensidade sonora do trator, comparada à da conversa, é',o:['30 vezes maior','100 vezes maior','300 vezes maior','1 000 vezes maior','1,4 vez maior'],a:3,e:'Cada 10 dB a mais é 10 vezes a intensidade. 30 dB a mais: 10·10·10 = 1 000 vezes.'}},

{id:'arco-iris',d:'Física',t:'O arco-íris depois da chuva',enem:'Óptica: refração e dispersão da luz',
ctx:'Depois de uma chuva de fim de tarde, o arco-íris aparece do lado oposto ao sol. Mude a altura do sol e descubra por que ele nunca aparece ao meio-dia.',
con:'A luz branca entra na gota de chuva, <b>refrata</b>, reflete no fundo da gota e refrata de novo ao sair. Cada cor tem um índice de refração um pouco diferente, então cada cor sai num ângulo: é a <b>dispersão</b>. O vermelho sai a cerca de <b>42°</b> e o violeta a cerca de <b>40°</b> da direção oposta ao sol. Com o sol acima de 42°, o arco fica abaixo do horizonte.',
c:[{id:'h',l:'Altura do sol',min:0,max:60,s:1,v:15,u:'°'},{id:'ch',l:'Chuva',opts:[[1,'Chuva forte (gotas grandes)'],[.55,'Chuvisco']],v:1}],
run:v=>{const aR=rainAng(1.331),aV=rainAng(1.343),top=aR-v.h;return{aR,aV,top,big:top>0?br(top,0)+'°':'não aparece',bl:'Altura do topo do arco-íris',st:top>20?['ok','Arco-íris alto e bonito']:top>0?['warn','Só um pedacinho acima do horizonte']:['bad','Sol alto demais: o arco ficou abaixo do horizonte'],m:[['Ângulo do vermelho',br(aR,1)+'°'],['Ângulo do violeta',br(aV,1)+'°'],['Hora parecida',v.h<25?'começo ou fim do dia':v.h<42?'meio da manhã ou da tarde':'perto do meio-dia'],['Lado do céu','oposto ao sol']],fx:`topo = ${br(aR,1)}° − ${v.h}° (altura do sol) = ${br(top,1)}°`}},

 <div class="stage"><div class="scene" id="sc"></div><div class="readout"><b id="big2"></b><span id="st2"></span></div><div class="hint" id="hint">${hint}</div></div>
 <div class="ctrl"><h2>Mexa aqui</h2>${s.c.map(c=>c.opts?`<div class="row sel"><label for="k-${c.id}">${c.l}</label><select id="k-${c.id}" data-k="${c.id}">${c.opts.map(o=>`<option value="${o[0]}"${o[0]==v[c.id]?' selected':''}>${o[1]}</option>`).join('')}</select></div>`:`<div class="row"><label for="k-${c.id}">${c.l}</label><output id="o-${c.id}">${fv(c,v[c.id])}</output><input type="range" id="k-${c.id}" data-k="${c.id}" min="${c.min}" max="${c.max}" step="${c.s}" value="${v[c.id]}"></div>`).join('')}${s.act?`<button class="btn" id="act">↻ ${s.act}</button>`:''}</div>
 <div class="res"><div class="lbl" id="bl"></div><div class="big" id="big"></div><div id="st" class="st"></div><div class="g2" id="mm"></div><div class="fx" id="fx"></div></div>
 </div>
 <div class="dica">${MASC}<div class="bubble"><b>Dica do Campina:</b> ${DICA[s.id]||'Mexa nos controles e observe o que muda!'}</div></div>
 <div class="two"><div><h2>Entenda</h2><p class="ctx2">${s.ctx}</p><p>${s.con}</p></div>
 <div class="q"><h2>★ Questão estilo Enem</h2><p>${s.q.p}</p>${s.q.o.map((o,j)=>`<button class="op" data-o="${j}"><b>${'ABCDE'[j]})</b><span>${o}</span></button>`).join('')}<div class="fb" id="fb" role="status"></div></div></div>
 <div class="nav2"><a href="#${pv.id}">← ${pv.t}</a><a href="#${nx.id}">${nx.t} →</a></div></main>`+foot;
 lastTxt={};frame(s,true);loop();
}
let lastTxt={};
function setT(id,val,html){if(lastTxt[id]===val)return;lastTxt[id]=val;const e=document.getElementById(id);if(e){if(html)e.innerHTML=val;else e.textContent=val}}
function frame(s,force){
 const now=performance.now()/1000,v=S[s.id],d=D[s.id];let moving=false;
 const a=RM?1:Math.min(1,(now-lastF||.016)*9);
 s.c.forEach(c=>{if(c.opts){d[c.id]=v[c.id];return}const df=v[c.id]-d[c.id];if(Math.abs(df)>(c.max-c.min)*.001){d[c.id]+=df*a;moving=true}else d[c.id]=v[c.id]});d.seed=v.seed;
 lastF=now;
 const r=s.run(d),t=RM?0:now,k=RM?99:now-T0[s.id];
 const sc=document.getElementById('sc');if(!sc)return;
 sc.innerHTML=wrapS(s,s.draw(d,r,t,k));
 setT('fx',r.fx,true);setT('bl',r.bl);setT('big',r.big);setT('big2',r.big);setT('st',r.st[1]);setT('st2',r.st[1]);
 const st=document.getElementById('st');if(st)st.className='st '+r.st[0];const s2=document.getElementById('st2');if(s2)s2.className=r.st[0];
 setT('mm',r.m.map(m=>`<div class="m"><span class="lbl">${m[0]}</span><b>${m[1]}</b></div>`).join(''),true);
 s.c.forEach(c=>{if(!c.opts)setT('o-'+c.id,fv(c,v[c.id]))});
}
function loop(){cancelAnimationFrame(raf);let acc=0,prev=0;const tick=ts=>{const s=cur();if(!s)return;raf=requestAnimationFrame(tick);if(document.hidden)return;if(ts-prev<33)return;prev=ts;frame(s)};if(RM){return}raf=requestAnimationFrame(tick)}
function upd(s){if(RM)frame(s)}
const cur=()=>SIMS.find(x=>x.id===location.hash.slice(1));
const restart=s=>{T0[s.id]=performance.now()/1000};
app.addEventListener('input',e=>{const k=e.target.dataset.k,s=cur();if(!k||!s)return;S[s.id][k]=+e.target.value;document.getElementById('hint')?.classList.add('off');upd(s)});
app.addEventListener('change',e=>{const k=e.target.dataset.k,s=cur();if(!k||!s)return;S[s.id][k]=+e.target.value;restart(s);upd(s)});
app.addEventListener('pointerdown',e=>{const sc=e.target.closest('#sc'),s=cur();if(!sc||!s)return;const dg=DRAG[s.id];if(!dg)return;e.preventDefault();sc.setPointerCapture?.(e.pointerId);const rc=sc.getBoundingClientRect();drag={s,x0:e.clientX,y0:e.clientY,w:rc.width,h:rc.height,vx:dg.x?S[s.id][dg.x]:0,vy:dg.y?S[s.id][dg.y]:0,dg};dragging=true;document.getElementById('hint')?.classList.add('off')});
app.addEventListener('pointermove',e=>{if(!drag)return;const {s,dg}=drag,set=(id,base,frac)=>{const c=s.c.find(c=>c.id===id);if(!c||c.opts)return;let nv=base+frac*(c.max-c.min)*1.3;nv=Math.round(nv/c.s)*c.s;nv=cl(+nv.toFixed(4),c.min,c.max);S[s.id][id]=nv;const inp=document.getElementById('k-'+id);if(inp)inp.value=nv};if(dg.x)set(dg.x,drag.vx,(e.clientX-drag.x0)/drag.w);if(dg.y)set(dg.y,drag.vy,-(e.clientY-drag.y0)/drag.h);upd(s)});
const endDrag=()=>{if(!drag)return;restart(drag.s);upd(drag.s);drag=null;dragging=false};
app.addEventListener('pointerup',endDrag);app.addEventListener('pointercancel',endDrag);
app.addEventListener('click',e=>{
 const f=e.target.closest('[data-f]');if(f){filtro=f.dataset.f;home();return}
 if(e.target.closest('#act')){const s=cur();S[s.id].seed++;restart(s);upd(s);return}
 const o=e.target.closest('[data-o]');if(o){const s=cur(),j=+o.dataset.o,fb=document.getElementById('fb');
  document.querySelectorAll('.op').forEach(b=>b.classList.remove('errado'));
  if(j===s.q.a){o.classList.add('certo');fb.style.color='var(--leaft)';fb.innerHTML='<b>Acertou!</b> '+s.q.e;done.add(s.id);save()}
  else{o.classList.add('errado');fb.style.color='var(--redt)';fb.textContent='Ainda não. Use a simulação para pensar e tente outra alternativa.'}}
});

function route(){cancelAnimationFrame(raf);const s=cur();s?page(s):home();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{})}catch(e){}})}
}
</script>
